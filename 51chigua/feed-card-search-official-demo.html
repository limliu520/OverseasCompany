function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function shortDate(iso) {
  const p = iso.split("-");
  return p[1] + "-" + p[2];
}
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("on");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove("on"), 2200);
}
function normQuery(q) {
  return String(q).toLowerCase().replace(/[^\u4e00-\u9fffa-z0-9]/g, "");
}
function has(text, q) {
  const n = normQuery(q);
  if (!n) return false;
  return String(text).toLowerCase().includes(n);
}
function relevance(post, q) {
  let score = 0;
  if (has(post.title, q)) score += 100;
  if (has(post.body, q)) score += 50;
  if ((post.commentTexts || []).some((text) => has(text, q))) score += 20;
  if (post.cats.some((cat) => has(cat, q))) score += 10;
  return score;
}
function markQuery(text, q) {
  const safe = esc(text);
  const n = normQuery(q);
  if (!n) return safe;
  const re = new RegExp(n.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "ig");
  return safe.replace(re, (m) => "<mark>" + m + "</mark>");
}
function clip(text, q) {
  const n = normQuery(q);
  const i = String(text).toLowerCase().indexOf(n);
  const start = Math.max(0, i - 8);
  const end = Math.min(text.length, i + n.length + 14);
  return (start > 0 ? "…" : "") + text.slice(start, end) + (end < text.length ? "…" : "");
}
function snippet(post, q) {
  if (has(post.title, q)) return "";
  if (has(post.body, q)) return markQuery(clip(post.body, q), q);
  const cat = post.cats.find((item) => has(item, q));
  if (cat) return "分类包含「" + markQuery(cat, q) + "」";
  const comment = (post.commentTexts || []).find((text) => has(text, q));
  if (comment) return "评论：" + markQuery(clip(comment, q), q);
  return "";
}
function matched() {
  const q = state.q.trim();
  const list = POSTS.filter((post) => relevance(post, q) > 0);
  if (state.sort === "hot") {
    list.sort((a, b) => b.heat - a.heat || b.date.localeCompare(a.date));
  } else if (state.sort === "new") {
    list.sort((a, b) => b.date.localeCompare(a.date));
  } else {
    list.sort((a, b) => relevance(b, q) - relevance(a, q) || b.date.localeCompare(a.date));
  }
  return list;
}
function cardHtml(post, q) {
  const titleHtml = q ? markQuery(post.title, q) : esc(post.title);
  const cats = (post.hot ? '<i class="hot">热门</i>' : "") +
    post.cats.map((c) => "<i>" + (q && has(c, q) ? markQuery(c, q) : esc(c)) + "</i>").join("");
  const bits = ["<span>" + esc(post.author) + "</span>", "<span>" + shortDate(post.date) + "</span>"];
  if (post.comments > 0) bits.push("<span>评 " + post.comments + "</span>");
  const snip = q ? snippet(post, q) : "";
  return '<article class="card"><div class="cover" style="background:' + coverBg(post.id) + '">' +
    '<div class="cover-foot"><h2>' + titleHtml + '</h2><div class="foot-row">' +
    (cats ? '<p class="cats">' + cats + "</p>" : "") +
    '<p class="meta">' + bits.join("") + "</p></div>" +
    (snip ? '<p class="snippet">' + snip + "</p>" : "") +
    "</div></div></article>";
}

function pager(total) {
  const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  if (total <= PAGE_SIZE) return "";
  const start = (state.page - 1) * PAGE_SIZE + 1;
  const end = Math.min(total, state.page * PAGE_SIZE);
  let btns = "";
  for (let i = 1; i <= pages; i++) {
    btns += '<button type="button" data-page="' + i + '"' + (i === state.page ? ' class="on"' : "") + ">" + i + "</button>";
  }
  return '<div class="pager"><button type="button" data-page="' + (state.page - 1) + '"' + (state.page === 1 ? " disabled" : "") + '>上一页</button>' +
    btns + '<button type="button" data-page="' + (state.page + 1) + '"' + (state.page === pages ? " disabled" : "") + '>下一页</button><span>第 ' +
    start + "–" + end + " 条，共 " + total + " 条</span></div>";
}

    FAQ.map(([q, a]) => "<h2>" + esc(q) + "</h2><p>" + esc(a) + "</p>").join("") +
    addrHtml() + "</article>";
}
function go(view, extra) {
  state.view = view;
  state.page = 1;
  if (view !== "search") state.searchOpen = false;
  if (view === "category") state.navOpen = true;
  if (view === "article" && (!extra || extra.replyTo === undefined)) state.replyTo = "瓜嫂";
  if (extra) Object.assign(state, extra);
  if (view === "search") state.searchOpen = false;
  const hash = view === "search"
    ? "#search=" + encodeURIComponent(state.q) + "&sort=" + state.sort
    : "#" + view;
  if (location.hash !== hash) history.replaceState(null, "", hash);
  render();
  if (view !== "contribute") window.scrollTo(0, 0);
}
function readHash() {
  const h = location.hash.replace(/^#/, "");
  if (h.startsWith("search=")) {
    const q = decodeURIComponent((h.match(/^search=([^&]*)/) || [])[1] || "");
    const sort = (h.match(/sort=(mix|hot|new)/) || [])[1] || "mix";
    go("search", { q, sort, searchOpen: true });
    return;
  }
  const known = ["join", "agreement", "faq", "home", "featured", "terms", "privacy", "brand", "category", "tags", "tag", "article", "contribute"];
  if (known.includes(h)) go(h);
  else go("home");
}
document.getElementById("app").addEventListener("click", (e) => {
  const act = e.target.closest("[data-act]");
  if (act) {
    const kind = act.dataset.act;
    if (kind === "reply") {
      state.replyTo = act.dataset.who;
      render();
      const box = document.getElementById("replyBody");
      if (box) box.focus();
      return;
    }
    if (kind === "submit-reply") {
      const body = (document.getElementById("replyBody") || {}).value || "";
      if (!body.trim()) return toast("先写点评论内容");
      state.replyTo = "";
      toast("回复已提交（Demo）");
      render();
      return;
    }
    if (kind === "submit-comment") {
      toast("评论已提交（Demo）");
      return;
    }
  }
  if (e.target.closest(".card") || e.target.closest(".feat-item")) {
    if (state.view !== "article") toast("文章详情沿用现网，本 Demo 不改详情页");
  }
  const pageBtn = e.target.closest("[data-page]");
  if (pageBtn && !pageBtn.disabled) {
    state.page = Number(pageBtn.dataset.page);
    render();
    return;
  }
  const sortBtn = e.target.closest("[data-sort]");
  if (sortBtn) {
    state.sort = sortBtn.dataset.sort;
    state.page = 1;
    go("search", { q: state.q, sort: state.sort });
    return;
  }
});
document.body.addEventListener("click", (e) => {
  const stub = e.target.closest("[data-stub]");
  if (stub) toast("本 Demo 只覆盖已列出的页面");
  const to = e.target.closest("[data-go]");
  if (to) {
    e.preventDefault();
    const view = to.dataset.go;
    const extra = {};
    if (to.dataset.cat) extra.cat = to.dataset.cat;
    if (view === "home") go("home", { q: "", searchOpen: false });
    else if (view === "category") go("category", Object.assign({ navOpen: true }, extra));
    else if (view === "article") go("article", { replyTo: "瓜嫂" });
    else go(view, extra);
  }
});
window.addEventListener("hashchange", readHash);
window.__demoGo = go;
readHash();
</script>
</body>
</html>
