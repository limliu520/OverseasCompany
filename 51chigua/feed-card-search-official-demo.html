  { id: "p3", title: "晚会直播镜头穿帮 两版成片被网友对上", body: "直播切镜时主持人还站在旧机位，回放成片已经换成了另一侧。", cats: ["今日吃瓜", "吃瓜新闻"], author: "瓜农", date: "2026-11-03", comments: 36, hot: true, heat: 860 },

const state = { view: "home", q: "", sort: "new", page: 1, searchOpen: false };

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function shortDate(iso) {
  const p = iso.split("-");
  return p[1] + "-" + p[2];
}
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("on");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove("on"), 2200);
}
function hitScore(post, q) {
  const raw = q.toLowerCase();
  if (!raw) return 0;
  if (post.title.toLowerCase().includes(raw)) return 3;
  if (post.cats.some((c) => c.toLowerCase().includes(raw))) return 2;
  if (post.body.toLowerCase().includes(raw)) return 1;
  return 0;
}
function snippet(post, q) {
  if (post.title.toLowerCase().includes(q.toLowerCase())) return "";
  const body = post.body;
  const i = body.toLowerCase().indexOf(q.toLowerCase());
  if (i < 0) {
    const cat = post.cats.find((c) => c.toLowerCase().includes(q.toLowerCase()));
    return cat ? "分类包含「" + cat + "」" : "";
  }
  const start = Math.max(0, i - 10);
  const end = Math.min(body.length, i + q.length + 16);
  const slice = (start > 0 ? "…" : "") + body.slice(start, end) + (end < body.length ? "…" : "");
  const safe = esc(slice);
  const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "ig");
  return safe.replace(re, (m) => "<mark>" + m + "</mark>");
}
function matched() {
  const q = state.q.trim();
  let list = POSTS.filter((p) => hitScore(p, q) > 0);
  if (state.sort === "hot") {
    list.sort((a, b) => b.heat - a.heat || b.date.localeCompare(a.date));
  } else {
    list.sort((a, b) => b.date.localeCompare(a.date));
  }
  return list;
}
function cardHtml(post, q) {
  const cats = post.cats.map((c) => "<i>" + esc(c) + "</i>").join("");
  const bits = ["<span>" + esc(post.author) + "</span>", "<span>" + shortDate(post.date) + "</span>"];
  if (post.comments > 0) bits.push("<span>评 " + post.comments + "</span>");
  const snip = q ? snippet(post, q) : "";
  return '<article class="card"><div class="cover" style="background:' + coverBg(post.id) + '">' +
    (post.hot ? '<span class="hot">热门</span>' : "") +
    '<div class="cover-foot"><h2>' + esc(post.title) + '</h2><div class="foot-row">' +
    (cats ? '<p class="cats">' + cats + "</p>" : "") +
    '<p class="meta">' + bits.join("") + "</p></div>" +
    (snip ? '<p class="snippet">' + snip + "</p>" : "") +
    "</div></div></article>";
}
function coverBg(id) {
  const map = {
    p1: "linear-gradient(120deg,#3a1d4a,#c44b7a 55%,#1b2438)",
    p2: "linear-gradient(120deg,#1d3a4a,#3d7ea6 50%,#241b38)",
    p3: "linear-gradient(120deg,#4a2a1d,#c47a4b 50%,#1b2438)",
    p4: "linear-gradient(120deg,#24331d,#6a9a45 50%,#1b2438)",
    p5: "linear-gradient(120deg,#2a244a,#6a5acd 48%,#1b2438)",
    p6: "linear-gradient(120deg,#4a1d32,#e05a7a 46%,#1c2436)",
    p7: "linear-gradient(120deg,#1d334a,#4aa0c4 52%,#241b2e)",
    p8: "linear-gradient(120deg,#3a321d,#c4a24b 50%,#1b2438)"
  };
  return map[id];
}
function pager(total) {
  const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  if (total <= PAGE_SIZE) return "";
  const start = (state.page - 1) * PAGE_SIZE + 1;
  const end = Math.min(total, state.page * PAGE_SIZE);
  let btns = "";
  for (let i = 1; i <= pages; i++) {
    btns += '<button type="button" data-page="' + i + '"' + (i === state.page ? ' class="on"' : "") + ">" + i + "</button>";
  }
  return '<div class="pager"><button type="button" data-page="' + (state.page - 1) + '"' + (state.page === 1 ? " disabled" : "") + '>上一页</button>' +
    btns + '<button type="button" data-page="' + (state.page + 1) + '"' + (state.page === pages ? " disabled" : "") + '>下一页</button><span>第 ' +
    start + "–" + end + " 条，共 " + total + " 条</span></div>";
}
function addrHtml() {

    "<li>海外：https://51cg1.com</li><li>永久：https://chigua.com</li></ul></aside>";
}

      "<h3>联系我们 Contact Us</h3><p>商务合作、投稿、侵权反馈：51cgfun@pm.me</p>" +
      addrHtml() + "</article>";
    return;
  }
  app.innerHTML = '<article class="doc"><h1>常见问题</h1>' +
    FAQ.map(([q, a]) => "<h2>" + esc(q) + "</h2><p>" + esc(a) + "</p>").join("") +
    addrHtml() + "</article>";
}
function go(view, extra) {
  state.view = view;
  state.page = 1;
  if (view !== "search") state.searchOpen = false;
  if (extra) Object.assign(state, extra);
  if (view === "search") state.searchOpen = true;
  const hash = view === "search"
    ? "#search=" + encodeURIComponent(state.q) + "&sort=" + state.sort
    : "#" + view;
  if (location.hash !== hash) history.replaceState(null, "", hash);
  document.getElementById("q").value = state.q;
  render();
  window.scrollTo(0, 0);
}
function readHash() {
  const h = location.hash.replace(/^#/, "");
  if (h.startsWith("search=")) {
    const q = decodeURIComponent((h.match(/^search=([^&]*)/) || [])[1] || "");
    const sort = (h.match(/sort=(hot|new)/) || [])[1] || "new";
    go("search", { q, sort, searchOpen: true });
    return;
  }
  if (h === "about" || h === "faq" || h === "home") go(h);
  else go("home");
}
document.getElementById("openSearch").addEventListener("click", () => {
  state.searchOpen = !state.searchOpen;
  render();
  if (state.searchOpen) document.getElementById("q").focus();
});
document.getElementById("searchForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const q = document.getElementById("q").value.trim();
  if (!q) return toast("先输入关键词");
  go("search", { q, sort: "new", searchOpen: true });
});
document.getElementById("app").addEventListener("click", (e) => {
  if (e.target.closest(".card")) toast("文章详情沿用现网，本 Demo 不改详情页");
  const pageBtn = e.target.closest("[data-page]");
  if (pageBtn && !pageBtn.disabled) {
    state.page = Number(pageBtn.dataset.page);
    render();
    return;
  }
  const sortBtn = e.target.closest("[data-sort]");
  if (sortBtn) {
    state.sort = sortBtn.dataset.sort;
    state.page = 1;
    go("search", { q: state.q, sort: state.sort });
    return;
  }
});
document.body.addEventListener("click", (e) => {
  const stub = e.target.closest("[data-stub]");
  if (stub) toast("本 Demo 只覆盖首页、搜索、关于我们和常见问题");
  const to = e.target.closest("[data-go]");
  if (to) {
    e.preventDefault();
    const view = to.dataset.go;
    if (view === "home") go("home", { q: "", searchOpen: false });
    else go(view);
  }
});
window.addEventListener("hashchange", readHash);
window.__demoGo = go;
readHash();
</script>
</body>
</html>
