<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>文档预览</title>
<style>
  :root {
    --bg: #f6f5f3;
    --paper: #fff;
    --ink: #1c1c1f;
    --muted: #5e5e66;
    --line: #e4e2de;
    --accent: #8d2f86;
    --code-bg: #f0eef2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.7 "PingFang SC", "Noto Sans SC", sans-serif;
  }
  .bar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 12px 20px;
    background: rgba(255,255,255,0.94);
    border-bottom: 1px solid var(--line);
    backdrop-filter: blur(8px);
  }
  .bar a { color: var(--muted); text-decoration: none; font-size: 13px; }
  .bar a:hover { color: var(--accent); }
  .bar .title { font-size: 13px; color: var(--ink); font-weight: 500; }
  .bar .hint { font-size: 12px; color: var(--muted); margin-left: auto; }

  main {
    max-width: 820px;
    margin: 0 auto;
    padding: 28px 24px 64px;
  }
  article {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 32px 36px 40px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
  }
  .status {
    padding: 24px;
    color: var(--muted);
    font-size: 14px;
  }
  .status.error { color: #a33; }

  article > *:first-child { margin-top: 0; }
  h1 { font-size: 26px; line-height: 1.3; margin: 0 0 16px; font-weight: 600; }
  h2 {
    font-size: 18px; margin: 32px 0 12px; padding-bottom: 8px;
    border-bottom: 1px solid var(--line); font-weight: 600;
  }
  h3 { font-size: 15px; margin: 22px 0 8px; color: var(--accent); font-weight: 600; }
  h4 { font-size: 14px; margin: 16px 0 6px; font-weight: 600; }
  p { margin: 0 0 12px; }
  ul, ol { margin: 0 0 12px; padding-left: 22px; }
  li { margin: 4px 0; }
  blockquote {
    margin: 12px 0;
    padding: 10px 14px;
    border-left: 3px solid var(--accent);
    background: #faf8fa;
    color: var(--muted);
  }
  blockquote p { margin: 0; }
  hr { border: none; border-top: 1px solid var(--line); margin: 28px 0; }
  a { color: var(--accent); }
  strong { font-weight: 600; }
  code {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 0.9em;
    background: var(--code-bg);
    padding: 1px 6px;
    border-radius: 4px;
  }
  pre {
    background: #1c1c1f;
    color: #e8e6e3;
    padding: 14px 16px;
    border-radius: 10px;
    overflow-x: auto;
    font-size: 12.5px;
    line-height: 1.55;
  }
  pre code { background: none; padding: 0; color: inherit; }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    margin: 12px 0 20px;
    background: #fff;
  }
  th, td {
    border: 1px solid var(--line);
    padding: 8px 10px;
    text-align: left;
    vertical-align: top;
  }
  th { background: #f3f0f2; font-weight: 600; }
  img { max-width: 100%; height: auto; border-radius: 8px; }

  @media (max-width: 640px) {
    article { padding: 20px 16px 28px; }
  }
</style>
</head>
<body>
  <div class="bar">
    <a href="./index.html">← 方舟重构</a>
    <span class="title" id="doc-title">文档预览</span>
    <span class="hint" id="doc-hint"></span>
  </div>
  <main>
    <div class="status" id="status">加载中…</div>
    <article id="content" hidden></article>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const file = params.get("f") || params.get("file");
    const statusEl = document.getElementById("status");
    const contentEl = document.getElementById("content");
    const titleEl = document.getElementById("doc-title");
    const hintEl = document.getElementById("doc-hint");

    function nameFromPath(p) {
      try { return decodeURIComponent(p.split("/").pop()); } catch { return p; }
    }

    if (!file) {
      statusEl.textContent = "请带上文件参数，例如 md-view.html?f=方舟-To-Be信息架构与权限草案.md";
      statusEl.classList.add("error");
    } else if (typeof marked === "undefined") {
      statusEl.innerHTML = "Markdown 渲染库加载失败。可检查网络，或用编辑器预览。<br>文件：<a href=\"" + file + "\">" + nameFromPath(file) + "</a>";
      statusEl.classList.add("error");
    } else {
      titleEl.textContent = nameFromPath(file);
      document.title = nameFromPath(file) + " · 预览";
      fetch(file)
        .then(function (r) {
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.text();
        })
        .then(function (text) {
          marked.setOptions({ gfm: true, breaks: false });
          contentEl.innerHTML = marked.parse(text);
          contentEl.hidden = false;
          statusEl.hidden = true;
          hintEl.textContent = file;
        })
        .catch(function (err) {
          statusEl.classList.add("error");
          statusEl.innerHTML =
            "无法加载 Markdown（常见原因：用 file:// 直接打开会被浏览器拦截本地请求）。<br>" +
            "请用本地静态服务打开本站，例如在项目根目录执行：<code>python3 -m http.server 8765</code>，再访问本页。<br><br>" +
            "错误：" + String(err.message || err) + "<br>" +
            "原始文件：<a href=\"" + file + "\">" + nameFromPath(file) + "</a>";
        });
    }
  </script>
</body>
</html>
