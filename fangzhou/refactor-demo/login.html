<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>登录 · 方舟</title>
  <link rel="stylesheet" href="./css/app.css?v=20261105novice" />
</head>
<body>
  <div class="login-page">
    <aside class="login-visual">
      <div>
        <div style="opacity:.7;font-size:13px;margin-bottom:24px">FANGZHOU · REFACTOR DEMO</div>
        <h2>更轻的业务端，从入驻开始重建</h2>
        <p>先选演示角色。新号先绑定谷歌验证。所有账号在密码和谷歌验证之后，还要验证登记的 Telegram。</p>
      </div>
      <div style="opacity:.55;font-size:12px">退出登录后回到本页重选角色</div>
    </aside>
    <main class="login-panel">
      <div class="login-box login-box--wide">
        <!-- 步骤 1：选角色 -->
        <div id="step-roles">
          <h1>选择演示角色</h1>
          <p class="muted" style="margin:0 0 16px">进入后可用左下角退出，回到此处切换。</p>
          <div class="login-roles" id="login-roles" role="listbox" aria-label="演示角色"></div>
          <button class="btn btn-primary" type="button" id="btn-next" style="width:100%;padding:12px;margin-top:16px">继续登录</button>
          <p class="hint" style="margin-top:16px">主账号由 Admin 开户（本 Demo 不包含 Admin）。</p>
        </div>

        <!-- 步骤 2：凭证 -->
        <div id="step-creds" hidden>
          <button type="button" class="btn btn-ghost login-back" id="btn-back">← 重选角色</button>
          <h1 id="creds-title">登录</h1>
          <p class="muted" id="creds-lead" style="margin:0 0 16px"></p>
          <form id="login-form">
            <div class="field">
              <label>账号</label>
              <input name="username" id="f-user" autocomplete="username" required />
            </div>
            <div class="field">
              <label>密码</label>
              <input name="password" id="f-pass" type="password" autocomplete="current-password" required />
            </div>
            <div class="field" id="field-totp">
              <label>谷歌验证码</label>
              <input name="totp" id="f-totp" inputmode="numeric" maxlength="6" placeholder="6 位动态码" autocomplete="one-time-code" />
            </div>
            <button class="btn btn-primary" type="submit" id="btn-submit" style="width:100%;padding:12px;margin-top:8px">登录</button>
          </form>
          <p class="hint" id="creds-hint" style="margin-top:16px"></p>
        </div>

        <div id="step-tg" hidden>
          <button type="button" class="btn btn-ghost login-back" id="btn-tg-back">← 返回登录</button>
          <h1>验证 Telegram</h1>
          <p class="muted" id="tg-lead" style="margin:0 0 16px">验证码发到该账号登记的 Telegram。请确认手机号后发送。</p>
          <div class="field">
            <label>手机号</label>
            <input id="tg-phone" inputmode="tel" autocomplete="tel" placeholder="+8613800000000" />
            <p class="hint">带 + 和国家码，须与创建子账号时填写的号码一致。</p>
          </div>
          <div style="display:flex;gap:8px;align-items:flex-end">
            <div class="field" style="flex:1;margin:0">
              <label>验证码</label>
              <input id="tg-code" inputmode="numeric" maxlength="6" placeholder="6 位验证码" autocomplete="one-time-code" />
            </div>
            <button type="button" class="btn" id="btn-tg-send">发送验证码</button>
          </div>
          <p class="hint" id="tg-msg" hidden style="color:var(--danger);margin-top:10px"></p>
          <button class="btn btn-primary" type="button" id="btn-tg-ok" style="width:100%;padding:12px;margin-top:16px">验证并进入</button>
        </div>
      </div>
    </main>
  </div>
  <script src="./js/perm-tree.js?v=20261106view1"></script>
  <script src="./js/store.js?v=20261106perm2"></script>
  <script>
    (function () {
      var selected = "owner";
      var roles = [
        {
          id: "owner",
          title: "主账号 · 日常运营",
          desc: "带演示项目，看满态工作台与异常提醒。",
          user: "demo_owner",
          pass: "demo1234"
        },
        {
          id: "owner_empty",
          title: "主账号 · 新号入驻",
          desc: "零业务项目：先输密码，再绑定新的谷歌验证二维码。",
          user: "demo_owner_new",
          pass: "demo1234",
          isNew: true
        },
        {
          id: "sub_demo_xiaowang",
          title: "子账号 · 小王（采集运营）",
          desc: "偏采集/素材权限，侧栏菜单更精简。",
          user: "ops_xiaowang",
          pass: "demo1234"
        },
        {
          id: "sub_demo_lili",
          title: "子账号 · 李丽（内容编辑）",
          desc: "素材与文章、部分审核相关权限。",
          user: "editor_lili",
          pass: "demo1234"
        },
        {
          id: "sub_demo_chen",
          title: "子账号 · 陈晨（项目管理）",
          desc: "项目与全局配置向，内容侧权限较少。",
          user: "pm_chen",
          pass: "demo1234"
        },
        {
          id: "sub_demo_tg",
          title: "子账号 · 阿凯（Telegram 验证）",
          desc: "采集向子账号，登录时同样要验证登记的 Telegram。",
          user: "ops_tg",
          pass: "demo1234"
        }
      ];

      function roleById(id) {
        for (var i = 0; i < roles.length; i++) {
          if (roles[i].id === id) return roles[i];
        }
        return roles[0];
      }

      var box = document.getElementById("login-roles");
      var stepRoles = document.getElementById("step-roles");
      var stepCreds = document.getElementById("step-creds");
      var stepTg = document.getElementById("step-tg");
      var pendingLogin = null;
      var tgExpected = "";
      var tgSent = false;

      box.innerHTML = roles
        .map(function (r) {
          return (
            '<button type="button" class="login-role' +
            (r.id === selected ? " is-on" : "") +
            '" role="option" aria-selected="' +
            (r.id === selected ? "true" : "false") +
            '" data-role="' +
            r.id +
            '"><strong>' +
            r.title +
            "</strong><span>" +
            r.desc +
            "</span></button>"
          );
        })
        .join("");

      box.addEventListener("click", function (e) {
        var btn = e.target.closest("[data-role]");
        if (!btn) return;
        selected = btn.getAttribute("data-role");
        box.querySelectorAll(".login-role").forEach(function (el) {
          var on = el.getAttribute("data-role") === selected;
          el.classList.toggle("is-on", on);
          el.setAttribute("aria-selected", on ? "true" : "false");
        });
      });

      function findSub(id) {
        var st = FZStore.read();
        return (st.subs || []).filter(function (u) {
          return u.id === id;
        })[0] || null;
      }

      function normPhone(v) {
        return String(v || "").replace(/[\s-]/g, "");
      }

      function lookupPhone(id) {
        if (String(id).indexOf("sub_") === 0) {
          var sub = findSub(id);
          return sub && sub.tgPhone ? normPhone(sub.tgPhone) : "";
        }
        var st = FZStore.read();
        var map = st.tgPhones || {};
        return normPhone(map[id] || "");
      }

      function phoneMismatchText() {
        return pendingLogin && pendingLogin.kind === "owner"
          ? "该手机号未在此账号登记，请联系管理员"
          : "该手机号未在此账号登记，请联系主账号";
      }

      function resolvePass(r) {
        if (!r) return "";
        if (r.isNew) return r.pass;
        if (String(r.id).indexOf("sub_") === 0) {
          var sub = findSub(r.id);
          return (sub && sub.password) || r.pass || "demo1234";
        }
        var st = FZStore.read();
        var map = st.accountPasswords || {};
        return map[r.id] || r.pass || "demo1234";
      }

      function needsEnroll(r) {
        if (!r) return false;
        if (r.isNew) return true;
        var sub = findSub(r.id);
        return !!(sub && sub.totpBound === false);
      }

      function showRoles() {
        stepTg.hidden = true;
        stepCreds.hidden = true;
        stepRoles.hidden = false;
        pendingLogin = null;
        tgSent = false;
      }

      function showTg(phone) {
        tgExpected = normPhone(phone);
        tgSent = false;
        stepRoles.hidden = true;
        stepCreds.hidden = true;
        stepTg.hidden = false;
        document.getElementById("tg-phone").value = phone || "";
        document.getElementById("tg-code").value = "";
        var msg = document.getElementById("tg-msg");
        msg.hidden = true;
        msg.textContent = "";
        document.getElementById("tg-phone").focus();
      }

      function showCreds() {
        var r = roleById(selected);
        var sub = findSub(r.id);
        stepRoles.hidden = true;
        stepTg.hidden = true;
        stepCreds.hidden = false;
        document.getElementById("f-user").value = r.user;
        document.getElementById("f-pass").value = resolvePass(r);
        document.getElementById("f-totp").value = "";
        var totpField = document.getElementById("field-totp");
        var title = document.getElementById("creds-title");
        var lead = document.getElementById("creds-lead");
        var hint = document.getElementById("creds-hint");
        var submit = document.getElementById("btn-submit");
        var enroll = needsEnroll(r);
        if (enroll && r.isNew) {
          totpField.hidden = true;
          document.getElementById("f-totp").required = false;
          title.textContent = "新号登录";
          lead.textContent = "输入密码后，将进入首次谷歌验证绑定（新二维码）。";
          hint.textContent = "演示：密码任意非空即可，下一步扫描绑定二维码。";
          submit.textContent = "登录并绑定验证器";
        } else if (enroll) {
          totpField.hidden = true;
          document.getElementById("f-totp").required = false;
          title.textContent = "重新绑定验证器";
          lead.textContent = "谷歌验证已重置。确认密码后进入绑定页，扫描新的二维码。";
          hint.textContent = "绑定完成前无法进入工作台。";
          submit.textContent = "登录并绑定验证器";
        } else if (String(r.id).indexOf("sub_") === 0 || r.id === "owner" || r.id === "owner_empty") {
          totpField.hidden = false;
          document.getElementById("f-totp").required = true;
          title.textContent = "登录";
          lead.textContent = "密码与谷歌验证码通过后，还要验证登记的 Telegram。";
          hint.textContent = r.id.indexOf("sub_") === 0
            ? "若刚重置过密码，请使用新密码登录。验证码填任意 6 位即可。"
            : "演示：密码与 6 位验证码填任意值即可（验证码须满 6 位）。";
          submit.textContent = "下一步";
        } else {
          totpField.hidden = false;
          document.getElementById("f-totp").required = true;
          title.textContent = "登录";
          lead.textContent = "密码与谷歌验证码通过后，还要验证登记的 Telegram。";
          hint.textContent = "演示：密码与 6 位验证码填任意值即可（验证码须满 6 位）。";
          submit.textContent = "下一步";
        }
        document.getElementById("f-pass").focus();
      }

      function enterHome(profileId, username) {
        var s = FZStore.read();
        FZStore.applyLoginProfile(s, profileId);
        s.username = username;
        s.totpBound = true;
        s.totpBindMode = "verify";
        (s.subs || []).forEach(function (u) {
          if (u.id === profileId) u.totpBound = true;
        });
        FZStore.write(s);
        location.href = "./pages/home.html";
      }

      document.getElementById("btn-next").addEventListener("click", function () {
        if (!selected) {
          alert("请选择演示角色");
          return;
        }
        showCreds();
      });

      document.getElementById("btn-back").addEventListener("click", function () {
        showRoles();
      });

      document.getElementById("btn-tg-back").addEventListener("click", function () {
        if (pendingLogin && pendingLogin.fromSession) {
          var st = FZStore.read();
          st.loggedIn = false;
          FZStore.write(st);
        }
        pendingLogin = null;
        showRoles();
      });

      document.getElementById("btn-tg-send").addEventListener("click", function () {
        var phone = normPhone(document.getElementById("tg-phone").value);
        var msg = document.getElementById("tg-msg");
        if (!/^\+\d{8,15}$/.test(phone)) {
          msg.hidden = false;
          msg.style.color = "var(--danger)";
          msg.textContent = "请填写带国家码的手机号，例如 +8613800138000";
          tgSent = false;
          return;
        }
        if (phone !== tgExpected) {
          msg.hidden = false;
          msg.style.color = "var(--danger)";
          msg.textContent = phoneMismatchText();
          tgSent = false;
          return;
        }
        tgSent = true;
        msg.hidden = false;
        msg.style.color = "var(--ink-2)";
        msg.textContent = "验证码已发到 Telegram（演示）。任意 6 位数字即可。";
        document.getElementById("tg-code").focus();
      });

      document.getElementById("btn-tg-ok").addEventListener("click", function () {
        var msg = document.getElementById("tg-msg");
        if (!tgSent) {
          msg.hidden = false;
          msg.style.color = "var(--danger)";
          msg.textContent = "请先发送验证码";
          return;
        }
        var phone = normPhone(document.getElementById("tg-phone").value);
        if (phone !== tgExpected) {
          msg.hidden = false;
          msg.style.color = "var(--danger)";
          msg.textContent = phoneMismatchText();
          return;
        }
        var code = (document.getElementById("tg-code").value || "").trim();
        if (!/^\d{6}$/.test(code)) {
          msg.hidden = false;
          msg.style.color = "var(--danger)";
          msg.textContent = "请输入 6 位验证码";
          return;
        }
        if (!pendingLogin) {
          alert("登录状态已失效，请重新登录");
          showRoles();
          return;
        }
        if (pendingLogin.fromSession) {
          location.href = "./pages/home.html";
          return;
        }
        enterHome(pendingLogin.profileId, pendingLogin.username);
      });

      document.getElementById("login-form").addEventListener("submit", function (e) {
        e.preventDefault();
        var r = roleById(selected);
        var user = (document.getElementById("f-user").value || "").trim();
        var pass = document.getElementById("f-pass").value || "";
        if (!user) {
          alert("请输入账号");
          return;
        }
        if (!pass) {
          alert("请输入密码");
          return;
        }
        var enroll = needsEnroll(r);
        if (!enroll) {
          var code = (document.getElementById("f-totp").value || "").trim();
          if (!/^\d{6}$/.test(code)) {
            alert("请输入 6 位谷歌验证码");
            return;
          }
        }

        var s = FZStore.read();
        var subAcc = null;
        if (String(selected).indexOf("sub_") === 0) {
          subAcc = findSub(selected);
          if (!subAcc) {
            alert("账号或密码错误");
            return;
          }
          var expect = subAcc.password || "demo1234";
          if (pass !== expect) {
            alert("账号或密码错误");
            return;
          }
          if (subAcc.disabled) {
            alert("该账号已停用，无法登录");
            return;
          }
        } else if (!r.isNew) {
          var ownerExpect = resolvePass(r);
          if (pass !== ownerExpect) {
            alert("账号或密码错误");
            return;
          }
        }

        if (enroll) {
          FZStore.applyLoginProfile(s, selected);
          s.username = user;
          s.totpBound = false;
          s.totpBindMode = "enroll";
          FZStore.write(s);
          location.href = "./totp.html?mode=enroll";
          return;
        }

        var phone = lookupPhone(selected);
        if (!phone) {
          alert(subAcc
            ? "该账号未登记 Telegram，请联系主账号"
            : "该账号未登记 Telegram，请联系管理员");
          return;
        }
        pendingLogin = {
          profileId: selected,
          username: user,
          fromSession: false,
          kind: subAcc ? "sub" : "owner"
        };
        showTg(phone);
      });

      (function openTgFromBind() {
        var params = new URLSearchParams(location.search);
        if (params.get("step") !== "tg") return;
        var s = FZStore.read();
        if (!s.loggedIn) return;
        var phone = lookupPhone(s.accountId);
        if (!phone) {
          location.href = "./pages/home.html";
          return;
        }
        selected = s.accountId;
        pendingLogin = {
          profileId: s.accountId,
          username: s.username,
          fromSession: true,
          kind: s.accountKind === "sub" ? "sub" : "owner"
        };
        showTg(phone);
      })();
    })();
  </script>
</body>
</html>
