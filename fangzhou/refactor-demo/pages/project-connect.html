<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>开发对接 · 方舟</title>
  <link rel="stylesheet" href="../css/app.css?v=20261028linear2" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <div class="topbar">
        <h1>开发对接</h1>
        <div class="topbar-actions">
          <a class="btn btn-ghost" id="btn-edit" href="#">项目编辑</a>
          <button type="button" class="btn btn-ghost" id="btn-close">关闭</button>
          <div id="top-user"></div>
        </div>
      </div>
      <div class="content" id="root">
        <p class="muted">加载中…</p>
      </div>
    </div>
  </div>
  <script src="../js/store.js?v=20261031demoPerm"></script>
  <script src="../js/shell.js"></script>
  <script src="../js/project-union.js?v=20261027twoGate"></script>
  <script>
    FZShell.boot({ active: "projects" });
    var id = new URLSearchParams(location.search).get("id");
    var st = FZStore.read();
    var p = FZStore.findProject(st, id);
    if (!p) {
      location.href = "./projects.html";
    }
    FZProjectUnion.normalizeProject(p);
    document.getElementById("btn-edit").href =
      "./project-edit.html?id=" + encodeURIComponent(id) + "&tab=connect";

    function intentBits(proj) {
      var bits = [];
      bits.push(FZProjectUnion.siteTypeLabel(proj.siteType));
      bits.push(proj.autoToEdit ? "进编辑：自动" : "进编辑：人工");
      bits.push(proj.autoPush ? "推业务方：自动" : "推业务方：待确认");
      bits.push(proj.apiBaseUrl ? "收件接口：已填" : "收件接口：未填");
      bits.push(proj.webhookUrl ? "事件通知：已填" : "事件通知：未填");
      return bits.join(" · ");
    }

    function fallbackCopy(text, ok, fail) {
      try {
        var ta = document.createElement("textarea");
        ta.value = text;
        ta.setAttribute("readonly", "");
        ta.style.position = "fixed";
        ta.style.left = "-9999px";
        document.body.appendChild(ta);
        ta.select();
        var done = document.execCommand("copy");
        document.body.removeChild(ta);
        if (done) ok();
        else fail();
      } catch (e) {
        fail();
      }
    }

    function copyText(text, label) {
      function ok() {
        FZShell.toast((label || "内容") + "已复制", "ok");
      }
      function fail() {
        FZShell.toast("复制失败，请手动选择", "err");
      }
      if (!text || text === "—") {
        FZShell.toast("无可复制内容", "err");
        return;
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(ok).catch(function () {
          fallbackCopy(text, ok, fail);
        });
      } else {
        fallbackCopy(text, ok, fail);
      }
    }

    function kvCopyRow(label, value, copyKey) {
      return (
        '<div class="kv-row">' +
        '<div class="kv-meta"><div class="kv-label">' +
        label +
        '</div><div class="kv-value" id="' +
        copyKey +
        '">' +
        (value || "—") +
        "</div></div>" +
        '<button type="button" class="btn" data-copy-text="' +
        copyKey +
        '" data-label="' +
        label +
        '">复制</button></div>'
      );
    }

    function render() {
      st = FZStore.read();
      p = FZStore.findProject(st, id);
      if (!p.creds) p.creds = FZStore.issueProjectCreds(p.id);
      var status = FZStore.projectStatusLabel(p);
      var creds = p.creds || {};
      var doneHint = p.contentActivated
        ? '<p class="muted" style="margin:0;font-size:13px">通道已接通。前置配置已按意向生效。本页供开发继续查凭证与收件配置。</p>'
        : '<p class="muted" style="margin:0;font-size:13px">给<strong>开发</strong>用：方舟签发的凭证（对方来接我们）+ 可选对方收件地址（我们推到对方）。运营创建流程里不再填这些。接通后可用下方 Demo 按钮模拟。</p>';

      document.getElementById("root").innerHTML =
        '<div class="card card-pad" style="margin-bottom:14px">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">' +
        "<div><div style=\"font-size:18px;font-weight:700\">" +
        p.name +
        '</div><div class="muted" style="font-size:13px;margin-top:4px">' +
        intentBits(p) +
        "</div></div>" +
        '<span class="tag ' +
        status.cls +
        '">' +
        status.text +
        "</span></div>" +
        '<div style="margin-top:12px">' +
        doneHint +
        "</div></div>" +
        '<div class="card card-pad" style="margin-bottom:14px">' +
        "<h2 style=\"margin:0 0 8px;font-size:16px\">① 方舟签发的通道凭证（只读）</h2>" +
        '<p class="muted" style="margin:0 0 12px;font-size:13px">交给业务方用来调方舟接口。展示 + 复制，不可编辑。一项目一套通道；推送身份用子账号「CMS 标识」。</p>' +
        '<div class="kv-block">' +
        kvCopyRow("App ID", creds.appId, "conn-appid") +
        kvCopyRow("App Secret", creds.appSecret, "conn-secret") +
        kvCopyRow("站点代码", p.siteCode || "—", "conn-scode") +
        "</div>" +
        '<div class="muted" style="font-size:12px;margin-top:10px">通道状态：' +
        (p.contentActivated ? "已接通" : "待接通") +
        "</div></div>" +
        '<div class="card card-pad" style="margin-bottom:14px" id="dev-connect-form">' +
        "<h2 style=\"margin:0 0 8px;font-size:16px\">② 对方收件与签名（开发填写）</h2>" +
        '<p class="muted" style="margin:0 0 12px;font-size:13px">需要方舟<strong>推内容到对方</strong>时再填对方接口；仅对方来调方舟时可留空。与项目详情「内容通道对接」同一套字段。</p>' +
        FZProjectUnion.renderConnectFields(p) +
        '<button type="button" class="btn btn-primary" id="btn-save-connect" style="margin-top:12px">保存对接参数</button></div>' +
        '<div class="card card-pad" style="margin-bottom:14px">' +
        "<strong>接入方案（占位）</strong>" +
        '<div class="code-block" style="margin-top:12px"><pre style="margin:0;white-space:pre-wrap">' +
        "# 对方 → 方舟（用上方 App ID / Secret）\n" +
        "Authorization: Bearer " +
        (creds.appSecret || "…") +
        "\n" +
        "POST /v1/projects/" +
        (creds.appId || "…") +
        "/content\n" +
        "# body 可带 cmsIdentity = 子账号 CMS 标识\n\n" +
        "# 方舟 → 对方（若已配收件地址）\n" +
        (p.apiBaseUrl
          ? p.apiBaseUrl + (p.apiPrefix || "/oash/v1")
          : "# （未配对方收件地址）") +
        "\n" +
        "# 事件通知（Webhook）：" +
        (p.webhookUrl || "未配置") +
        "\n" +
        "</pre></div>" +
        '<div class="placeholder-doc" style="margin-top:12px"><strong>对接文档链接（占位）</strong>正式环境提供规范与示例工程。</div>' +
        "</div>" +
        '<div style="display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap">' +
        '<button type="button" class="btn btn-ghost" id="btn-close-2">关闭</button>' +
        (p.contentActivated
          ? '<a class="btn btn-primary" href="./project-edit.html?id=' +
            encodeURIComponent(id) +
            '">查看项目</a>'
          : '<button type="button" class="btn btn-primary" id="btn-test">模拟接通成功</button>') +
        "</div>";

      document.querySelectorAll("[data-copy-text]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var el = document.getElementById(btn.getAttribute("data-copy-text"));
          var raw = el ? (el.textContent || "").trim() : "";
          copyText(raw, btn.getAttribute("data-label"));
        });
      });
      var saveBtn = document.getElementById("btn-save-connect");
      if (saveBtn) {
        saveBtn.addEventListener("click", function () {
          var draft = {};
          FZProjectUnion.collectConnect(document, draft);
          var err = FZProjectUnion.validateConnect(draft);
          if (err) {
            FZShell.toast(err, "err");
            return;
          }
          var s2 = FZStore.read();
          var proj = FZStore.findProject(s2, id);
          proj.siteCode = draft.siteCode || proj.siteCode;
          proj.apiBaseUrl = draft.apiBaseUrl;
          proj.apiPrefix = draft.apiPrefix;
          proj.appSecret = draft.appSecret;
          proj.webhookUrl = draft.webhookUrl;
          proj.webhook = !!draft.webhookUrl;
          proj.channelNotes = draft.channelNotes;
          FZStore.upsertProject(s2, proj);
          FZStore.write(s2);
          p = proj;
          FZShell.toast("对接参数已保存", "ok");
          render();
        });
      }
      document.getElementById("btn-close-2").addEventListener("click", closePage);
      var testBtn = document.getElementById("btn-test");
      if (testBtn) {
        testBtn.addEventListener("click", function () {
          var s2 = FZStore.read();
          var proj = FZStore.findProject(s2, id);
          FZStore.markContentConnected(proj);
          FZStore.upsertProject(s2, proj);
          FZStore.write(s2);
          FZShell.toast(
            proj.status === "need_collect"
              ? "已接通；自动流意向将生效，但仍缺采集源（演示）"
              : "已接通，前置配置生效，项目创建完成"
          );
          location.href = "./projects.html";
        });
      }
    }

    function closePage() {
      if (!p.contentActivated) {
        FZShell.toast("可关闭。接通后状态会变为已完成；也可在待办/列表查看");
      }
      location.href = "./projects.html";
    }
    document.getElementById("btn-close").addEventListener("click", closePage);

    render();
  </script>
</body>
</html>
