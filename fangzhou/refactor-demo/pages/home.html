<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>工作台 · 方舟</title>
  <link rel="stylesheet" href="../css/app.css?v=20261104createBlk1" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <div class="topbar">
        <h1 id="greet">工作台</h1>
        <div class="topbar-actions" id="top-user"></div>
      </div>
      <div class="content wb-page" id="wb-root">
        <div id="wb-novice" class="wb-novice-mount" hidden></div>
        <!-- 第一排：数据概览 -->
        <section class="wb-band card card-pad wb-stats-band wb-stats-band--solo">
          <div class="wb-mod-head">
            <h2>数据概览</h2>
          </div>
          <div class="wb-stats-body">
            <div class="wb-stats" id="wb-stats"></div>
            <div class="wb-stats-extra" id="wb-stats-extra"></div>
          </div>
        </section>
        <!-- 第二排：异常提醒 | 平台公告 -->
        <div class="wb-row-2 wb-row-2--alert-announce">
          <section class="wb-band card card-pad wb-alert-band" id="wb-band-alerts">
            <div class="wb-mod-head">
              <h2>状态与异常提醒</h2>
            </div>
            <div class="wb-dense" id="wb-alerts"></div>
          </section>
          <section class="wb-band card card-pad wb-announce-band">
            <div class="wb-mod-head">
              <h2>平台公告</h2>
              <a class="wb-sec-more" href="./announcements.html">全部公告</a>
            </div>
            <div class="wb-announce" id="wb-announce"></div>
          </section>
        </div>
      </div>
    </div>
  </div>

  <!-- 工作台内直接审核：复用素材详情弹窗 -->
  <div class="mat-detail-mask" id="mat-detail-mask" hidden>
    <div class="mat-detail" role="dialog" aria-modal="true" aria-labelledby="mat-detail-title">
      <div class="mat-detail-hd">
        <h2 class="mat-detail-title" id="mat-detail-title">
          素材详情 <span class="mat-detail-progress" id="mat-detail-progress"></span>
        </h2>
        <button type="button" class="mat-detail-close" data-mat-close aria-label="关闭">×</button>
      </div>
      <div class="mat-detail-tabs">
        <button type="button" class="mat-tab is-active" data-mat-tab="info">基本信息</button>
        <button type="button" class="mat-tab" data-mat-tab="dispatch">分发记录</button>
      </div>
      <div id="mat-detail-panel"></div>
      <button type="button" class="mat-nav-side is-prev" id="mat-detail-prev" title="上一条素材" aria-label="上一条素材">‹</button>
      <button type="button" class="mat-nav-side is-next" id="mat-detail-next" title="下一条素材" aria-label="下一条素材">›</button>
    </div>
  </div>
  <div class="mat-xfer-mask" id="mat-xfer-mask" hidden>
    <div class="mat-xfer" role="dialog" aria-modal="true">
      <div class="mat-xfer-hd">
        <h3>转编辑</h3>
        <button type="button" class="mat-detail-close" data-xfer-close aria-label="关闭">×</button>
      </div>
      <div class="mat-xfer-bd">
        <input type="hidden" id="mat-xfer-mid" />
        <p class="mat-xfer-lead muted">选择项目后，素材将占用该项目内容通道，并派发媒体处理。</p>
        <div class="mat-form-row">
          <label for="mat-xfer-project">选择项目 *</label>
          <select id="mat-xfer-project"></select>
          <div class="mat-xfer-hint" id="mat-xfer-hint"></div>
        </div>
        <div class="mat-form-row">
          <label for="mat-xfer-cover">文章封面拼图</label>
          <select id="mat-xfer-cover">
            <option value="1">单拼图</option>
            <option value="2">二拼图</option>
            <option value="3" selected>三拼图</option>
          </select>
          <div class="mat-xfer-hint">默认取所选项目配置；可改本次转编辑。生成的是文章封面。</div>
        </div>
      </div>
      <div class="mat-xfer-ft">
        <button type="button" class="btn btn-ghost" data-xfer-close">取消</button>
        <button type="button" class="btn btn-primary" id="mat-xfer-submit" disabled>确认转编辑</button>
      </div>
    </div>
  </div>
  <div class="mat-targets-mask" id="mat-targets-mask" hidden>
    <div class="mat-targets" role="dialog" aria-modal="true" aria-labelledby="mat-targets-title">
      <div class="mat-targets-hd">
        <h3 id="mat-targets-title">分发频道</h3>
        <button type="button" class="mat-detail-close" data-targets-close aria-label="关闭">×</button>
      </div>
      <div class="mat-targets-bd" id="mat-targets-bd"></div>
      <div class="mat-targets-ft">
        <button type="button" class="btn btn-ghost" data-targets-close">关闭</button>
      </div>
    </div>
  </div>
  <div class="mat-reject-mask" id="mat-reject-mask" hidden>
    <div class="mat-reject" role="dialog" aria-modal="true">
      <div class="mat-reject-hd">
        <h3 id="mat-reject-title">驳回素材</h3>
        <button type="button" class="mat-detail-close" data-reject-close aria-label="关闭">×</button>
      </div>
      <div class="mat-reject-bd">
        <input type="hidden" id="mat-reject-mid" />
        <input type="hidden" id="mat-reject-mode" value="reject" />
        <div class="mat-form-row">
          <label for="mat-reject-reason" id="mat-reject-label">驳回理由 *</label>
          <textarea id="mat-reject-reason" placeholder="请输入驳回理由（将反馈给自学习机制优化筛选规则）"></textarea>
        </div>
      </div>
      <div class="mat-reject-ft">
        <button type="button" class="btn btn-ghost" data-reject-close">取消</button>
        <button type="button" class="btn btn-danger" id="mat-reject-submit">确认驳回</button>
      </div>
    </div>
  </div>

  <script src="../js/perm-tree.js?v=20261031navProj"></script>
  <script src="../js/store.js?v=20261031poolCollect"></script>
  <script src="../js/project-union.js?v=20261029wb4"></script>
  <script src="../js/materials-data.js?v=20261029wb4"></script>
  <script src="../js/materials-media.js?v=20261029wb16"></script>
  <script src="../js/materials-detail.js?v=20261029wb16"></script>
  <script src="../js/materials-transfer.js?v=20261104cover2"></script>
  <script src="../js/articles-data.js?v=20261029wb4"></script>
  <script src="../js/shell.js?v=20261104mono4"></script>
  <script src="../js/announcements-data.js?v=20261029wb13"></script>
  <script src="../js/novice-guide.js?v=20261031demoEdit"></script>
  <script src="../js/menu-tour.js?v=20261029wb33"></script>
  <script src="../js/home-app.js?v=20261104create1"></script>
  <script>
    FZShell.boot({ active: "home" });
    var hour = new Date().getHours();
    var hello = hour < 12 ? "早上好" : hour < 18 ? "下午好" : "晚上好";
    var s = FZStore.read();
    document.getElementById("greet").textContent =
      hello + "，" + (s.displayName || s.username || "");
    FZHomeApp.boot();
  </script>
</body>
</html>
