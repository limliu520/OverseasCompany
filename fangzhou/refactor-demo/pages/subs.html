<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>子账号与授权 · 方舟</title>
  <link rel="stylesheet" href="../css/app.css?v=20261104subH248" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <div class="topbar">
        <h1>子账号与授权</h1>
        <div class="topbar-actions">
          <div id="top-user"></div>
        </div>
      </div>
      <div class="content content--dock-pager">
        <div class="page-scroll">
          <div class="seg-tabs" role="tablist" aria-label="子账号与岗位">
            <button type="button" class="btn" id="tab-subs" data-tab="subs" role="tab">子账号</button>
            <button type="button" class="btn" id="tab-roles" data-tab="roles" role="tab">岗位</button>
          </div>
          <div class="list-toolbar">
            <div class="list-toolbar-row" id="sub-toolbar"></div>
          </div>
          <div class="fz-card-grid sub-card-grid" id="list-box"></div>
        </div>
        <div class="pager-dock" id="list-pager"></div>
      </div>
    </div>
  </div>

  <div class="modal-mask" id="sub-modal" hidden>
    <div class="modal modal-perm modal-sub-wiz">
      <h2 id="sub-modal-title">创建子账号</h2>
      <p class="hint" id="sub-modal-lead" style="margin-top:0">分三步：① 个人信息 → ② 负责项目 → ③ 岗位与权限。</p>
      <div class="sub-wiz-steps" id="sub-wiz-steps" role="tablist" aria-label="创建步骤">
        <button type="button" class="sub-wiz-step is-on" data-goto-step="1" role="tab" aria-selected="true">
          <span class="sub-wiz-num">1</span><span class="sub-wiz-label">个人信息</span>
        </button>
        <button type="button" class="sub-wiz-step" data-goto-step="2" role="tab" aria-selected="false">
          <span class="sub-wiz-num">2</span><span class="sub-wiz-label">负责项目</span>
        </button>
        <button type="button" class="sub-wiz-step" data-goto-step="3" role="tab" aria-selected="false">
          <span class="sub-wiz-num">3</span><span class="sub-wiz-label">岗位权限</span>
        </button>
      </div>

      <div class="sub-wiz-pane" id="sub-step-1" data-step="1">
        <div class="field" id="sub-user-field">
          <label>登录名 *</label>
          <input id="sub-user" placeholder="例如：ops_xiaowang" autocomplete="off" />
        </div>
        <div class="field" id="sub-user-ro" hidden>
          <label>登录名</label>
          <div class="muted" id="sub-user-ro-text" style="font-family:ui-monospace,monospace;font-size:13px"></div>
        </div>
        <div class="field"><label>显示名 *</label><input id="sub-name" placeholder="花名 / 对外称呼" /></div>
        <div class="field" id="sub-pass-field">
          <label>初始密码 *</label>
          <input id="sub-pass" type="password" value="Changeme1" autocomplete="new-password" />
        </div>
        <div class="field">
          <label>CMS 标识</label>
          <input id="sub-cms" placeholder="从对方后台复制的 ID，可空" />
          <p class="hint">内容通道推送时带上此 ID，由接收方判断内容归属。</p>
        </div>
      </div>

      <div class="sub-wiz-pane" id="sub-step-2" data-step="2" hidden>
        <p class="hint" style="margin:0 0 12px">点选该子账号可负责的业务项目（可多选，至少一项）。公共池不在此授权。</p>
        <div class="sub-proj-pick" id="sub-projects" role="group" aria-label="负责项目"></div>
        <p class="muted" id="sub-proj-count" style="margin:12px 0 0;font-size:12.5px"></p>
      </div>

      <div class="sub-wiz-pane" id="sub-step-3" data-step="3" hidden>
        <div class="field">
          <label>岗位 *</label>
          <p class="hint" style="margin:0 0 8px">先选岗位套用权限；改下方勾选后自动变为「自定义」。</p>
          <div class="preset-chips role-presets" id="sub-role-presets" role="group" aria-label="岗位"></div>
        </div>
        <div class="field">
          <label>功能权限 *</label>
          <div id="sub-feats"></div>
        </div>
      </div>

      <div class="modal-actions sub-wiz-actions">
        <button type="button" class="btn btn-ghost" id="sub-cancel">取消</button>
        <div class="sub-wiz-nav">
          <button type="button" class="btn" id="sub-prev" hidden>上一步</button>
          <button type="button" class="btn btn-primary" id="sub-next">下一步</button>
          <button type="button" class="btn btn-primary" id="sub-save" hidden>保存</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-mask" id="role-modal" hidden>
    <div class="modal modal-perm">
      <h2 id="role-modal-title">新建岗位</h2>
      <p class="hint" style="margin-top:0">岗位 = 可复用的菜单与页内操作权限包。创建子账号时可套用后再微调。</p>
      <div class="field"><label>岗位名称</label><input id="role-name" placeholder="例如：采集运营" /></div>
      <div class="field">
        <label>权限范围 *</label>
        <div id="role-feats"></div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="role-cancel">取消</button>
        <button type="button" class="btn btn-primary" id="role-save">保存</button>
      </div>
    </div>
  </div>

  <div class="modal-mask" id="sub-pass-modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="sub-pass-title">
      <h2 id="sub-pass-title">重置密码</h2>
      <p class="hint" id="sub-pass-lead" style="margin-top:0">为该子账号设置新登录密码。生效后对方须用新密码登录。</p>
      <div class="field">
        <label>新密码 *</label>
        <div style="display:flex;gap:8px;align-items:center">
          <input id="sub-pass-new" type="password" autocomplete="new-password" placeholder="至少 8 位" style="flex:1" />
          <button type="button" class="btn btn-ghost" id="sub-pass-gen">随机生成</button>
        </div>
      </div>
      <div class="field">
        <label>确认新密码 *</label>
        <input id="sub-pass-confirm" type="password" autocomplete="new-password" placeholder="再输入一次" />
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="sub-pass-cancel">取消</button>
        <button type="button" class="btn btn-primary" id="sub-pass-ok">确认重置</button>
      </div>
    </div>
  </div>

  <div class="modal-mask" id="sub-pass-done-modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="sub-pass-done-title">
      <h2 id="sub-pass-done-title">密码已重置</h2>
      <p class="hint" style="margin-top:0">请将新密码告知对方。关闭后无法再查看明文，请先复制。</p>
      <div class="field">
        <label>登录名</label>
        <div class="muted" id="sub-pass-done-user" style="font-family:ui-monospace,monospace;font-size:13px"></div>
      </div>
      <div class="field">
        <label>新密码</label>
        <div style="display:flex;gap:8px;align-items:center">
          <code id="sub-pass-done-pwd" style="flex:1;padding:8px 10px;background:var(--fill,#f4f4f5);border-radius:8px;font-size:14px;word-break:break-all"></code>
          <button type="button" class="btn" id="sub-pass-copy">复制</button>
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-primary" id="sub-pass-done-ok">我已抄下</button>
      </div>
    </div>
  </div>

  <script src="../js/store.js?v=20261104alwaysOn1"></script>
  <script src="../js/perm-tree.js?v=20261104alwaysOn1"></script>
  <script src="../js/shell.js?v=20261104confirm1"></script>
  <script src="../js/pager.js?v=20261104rf03"></script>
  <script src="../js/project-union.js?v=20261104rf"></script>
  <script src="../js/novice-guide.js?v=20261031tour7"></script>
  <script src="../js/novice-tour-kit.js?v=20261031prefill"></script>
  <script src="../js/novice-tours.js?v=20261031prefill"></script>
  <script src="../js/subs-app.js?v=20261104noDesc1"></script>
</body>
</html>
