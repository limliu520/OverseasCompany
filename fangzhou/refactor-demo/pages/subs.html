<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>子账号与授权 · 方舟</title>
  <link rel="stylesheet" href="../css/app.css?v=20261026aspect2" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <div class="topbar">
        <h1>子账号与授权</h1>
        <div class="topbar-actions">
          <button type="button" class="btn btn-primary" id="btn-primary-act">+ 创建子账号</button>
          <div id="top-user"></div>
        </div>
      </div>
      <div class="content">
        <div style="display:flex;gap:4px;margin-bottom:14px">
          <button type="button" class="btn" id="tab-subs" data-tab="subs">子账号</button>
          <button type="button" class="btn" id="tab-roles" data-tab="roles">岗位</button>
        </div>
        <p class="muted" id="tab-desc" style="margin:0 0 14px"></p>
        <div class="fz-card-grid sub-card-grid" id="list-box"></div>
      </div>
    </div>
  </div>

  <div class="modal-mask" id="sub-modal" hidden>
    <div class="modal modal-perm">
      <h2 id="sub-modal-title">创建子账号</h2>
      <p class="hint" style="margin-top:0">列表只读；在此创建或编辑。权限按侧栏层级 + 页内操作勾选。CMS 标识推送内容通道时携带。</p>
      <div class="field" id="sub-user-field">
        <label>登录名 *</label>
        <input id="sub-user" placeholder="例如：ops_xiaowang" />
      </div>
      <div class="field" id="sub-user-ro" hidden>
        <label>登录名</label>
        <div class="muted" id="sub-user-ro-text" style="font-family:ui-monospace,monospace;font-size:13px"></div>
      </div>
      <div class="field"><label>显示名</label><input id="sub-name" placeholder="花名" /></div>
      <div class="field" id="sub-pass-field">
        <label>初始密码 *</label>
        <input id="sub-pass" type="password" value="Changeme1" />
      </div>
      <div class="field">
        <label>CMS 标识</label>
        <input id="sub-cms" placeholder="从对方后台复制的 ID，可空" />
        <p class="hint">内容通道推送时带上此 ID，由接收方判断内容归属。</p>
      </div>
      <div class="field">
        <label>权限预设</label>
        <p class="hint" style="margin:0 0 8px">点岗位快捷套用下方权限；改下方勾选后自动回到「自定义」。</p>
        <div class="preset-chips role-presets" id="sub-role-presets" role="group" aria-label="权限预设"></div>
      </div>
      <div class="field">
        <label>功能权限 *</label>
        <div id="sub-feats"></div>
      </div>
      <div class="field">
        <label>可见项目 *（至少一项）</label>
        <div id="sub-projects"></div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="sub-cancel">取消</button>
        <button type="button" class="btn btn-primary" id="sub-save">保存</button>
      </div>
    </div>
  </div>

  <div class="modal-mask" id="role-modal" hidden>
    <div class="modal modal-perm">
      <h2 id="role-modal-title">新建岗位</h2>
      <p class="hint" style="margin-top:0">岗位 = 可复用的菜单与页内操作权限包。创建子账号时可套用后再微调。</p>
      <div class="field"><label>岗位名称</label><input id="role-name" placeholder="例如：采集运营" /></div>
      <div class="field">
        <label>权限范围 *</label>
        <div id="role-feats"></div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="role-cancel">取消</button>
        <button type="button" class="btn btn-primary" id="role-save">保存</button>
      </div>
    </div>
  </div>

  <script src="../js/store.js?v=20261026e"></script>
  <script src="../js/perm-tree.js?v=20261026d"></script>
  <script src="../js/shell.js?v=20261026d"></script>
  <script src="../js/subs-app.js?v=20261026aspect2"></script>
</body>
</html>
