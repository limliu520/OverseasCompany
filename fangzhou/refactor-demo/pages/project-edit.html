<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>项目详情 · 方舟</title>
  <link rel="stylesheet" href="../css/app.css?v=20261104kvrow3" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <div class="topbar">
        <div style="display:flex;align-items:center;gap:12px;min-width:0">
          <a class="btn" href="./projects.html">← 项目列表</a>
          <h1 style="margin:0">项目详情</h1>
        </div>
        <div class="topbar-actions" id="topbar-cta"></div>
      </div>
      <div class="content" id="root"><p class="muted">加载中…</p></div>
    </div>
  </div>

  <div class="modal-mask" id="basic-modal" hidden>
    <div class="modal" style="width:min(640px,100%)">
      <h2>编辑基本信息</h2>
      <p class="hint" style="margin-top:0">展示与编辑分离：名称、类型与封面（文章封面 + 视频封面）在此修改。一个项目一套内容通道。</p>
      <div class="field"><label>项目名称 *</label><input id="b-name" /></div>
      <div class="field"><label>站点类型</label>
        <div id="basic-site-types"></div>
        <p class="hint" id="b-type-hint" style="margin-top:8px">创建后仍可改。改类型只影响后续出稿/分集等规则，已产出的历史稿不会自动重跑或改写。</p>
      </div>
      <div class="field"><label>文章封面尺寸（生成与推送共用，200–4096px）</label>
        <div class="ratio-row">
          <div class="field"><label>宽 (px)</label><input id="b-cw" /></div>
          <div class="field"><label>高 (px)</label><input id="b-ch" /></div>
        </div>
      </div>
      <div class="field"><label>文章封面拼图</label>
        <div class="fz-seg" role="radiogroup" data-seg-name="b-panel" aria-label="文章封面拼图">
          <button type="button" class="fz-seg-btn" data-seg-value="1" aria-pressed="false">单拼图</button>
          <button type="button" class="fz-seg-btn" data-seg-value="2" aria-pressed="false">二拼图</button>
          <button type="button" class="fz-seg-btn is-on" data-seg-value="3" aria-pressed="true">三拼图</button>
        </div>
        <p class="hint" style="margin:8px 0 0">转编辑默认用此拼图数；弹窗里可改本次。</p>
      </div>
      <div class="field"><label>视频封面默认策略</label>
        <div class="fz-seg" role="radiogroup" data-seg-name="b-vcs" aria-label="视频封面默认策略">
          <button type="button" class="fz-seg-btn is-on" data-seg-value="article" aria-pressed="true">文章封面</button>
          <button type="button" class="fz-seg-btn" data-seg-value="first_frame" aria-pressed="false">视频首帧</button>
          <button type="button" class="fz-seg-btn" data-seg-value="random" aria-pressed="false">随机视频抽帧</button>
        </div>
        <p class="hint" style="margin:8px 0 0">转编辑按此策略出视频封面；单篇可在文章编辑单独上传覆盖。</p>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="basic-cancel">取消</button>
        <button type="button" class="btn btn-primary" id="basic-save">保存</button>
      </div>
    </div>
  </div>

  <script src="../js/store.js?v=20261031poolCollect"></script>
  <script src="../js/shell.js?v=20261104mono4"></script>
  <script src="../js/novice-guide.js?v=20261031demoEdit"></script>
  <script src="../js/novice-tour-kit.js?v=20261031prefill"></script>
  <script src="../js/novice-tours.js?v=20261104copyTab1"></script>
  <script src="../js/article-defaults.js?v=20261028wmFx2"></script>
  <script src="../js/media-config.js?v=20261104liveCfg1"></script>
  <script src="../js/pick-cards.js"></script>
  <script src="../js/tg-add-wizard.js?v=20261028tipAll"></script>
  <script src="../js/project-union.js?v=20261104siteDesc1"></script>
  <script>
    FZShell.boot({ active: "projects" });
    var id = new URLSearchParams(location.search).get("id");
    var tab = new URLSearchParams(location.search).get("tab") || "watermark";
    var NOVICE_DEMO_ID = "novice_demo_edit";
    var noviceDemoProject = null;
    var wmAddView = "image";
    var artSection = "prompt";
    var artView = "custom";

    function isNoviceEditTour() {
      try {
        return new URLSearchParams(location.search).get("novice") === "edit_project";
      } catch (e) {
        return false;
      }
    }

    function editPageUrl(nextTab) {
      var u =
        "./project-edit.html?id=" +
        encodeURIComponent(id) +
        "&tab=" +
        encodeURIComponent(nextTab || tab);
      try {
        var nov = new URLSearchParams(location.search).get("novice");
        if (nov) u += "&novice=" + encodeURIComponent(nov);
      } catch (e) {}
      return u;
    }

    function makeNoviceDemoProject() {
      var p = {
        id: NOVICE_DEMO_ID,
        name: "每日大赛",
        siteType: "chigua",
        status: "pending_activate",
        contentActivated: false,
        coverWidth: "720",
        coverHeight: "1280",
        coverAspect: "",
        autoToEdit: false,
        autoPush: false,
        boundChannels: [],
        optionalPacks: {},
        userbotIds: [],
        userbotId: "",
        userbotName: "",
        creds: { appId: "demo_app_id", appSecret: "demo_secret" }
      };
      FZProjectUnion.normalizeProject(p);
      FZArticle.ensureWatermarks(p);
      FZArticle.ensureArticle(p);
      return p;
    }

    function usingNoviceDemo() {
      return isNoviceEditTour() && (id === NOVICE_DEMO_ID || !FZStore.findProject(FZStore.read(), id));
    }
    var ALL_TABS = [
      { id: "watermark", label: "水印管理" },
      { id: "intro", label: "片头和片尾" },
      { id: "article", label: "文案管理" },
      { id: "media", label: "内容生成规则" },
      { id: "channel", label: "TG 采集号" },
      { id: "flow", label: "推送规则" },
      { id: "connect", label: "内容通道对接配置" },
      { id: "optional", label: "可选功能" }
    ];
    /** 短剧站不展示「文案管理」（与创建向导 needsArticle 一致） */
    function tabsForProject(p) {
      return ALL_TABS.filter(function (t) {
        if (t.id === "article") return FZProjectUnion.needsArticle(p && p.siteType);
        return true;
      });
    }
    if (!ALL_TABS.some(function (t) { return t.id === tab; })) tab = "watermark";
    var POS = [
      ["top-left", "左上"],
      ["top-right", "右上"],
      ["bottom-left", "左下"],
      ["bottom-right", "右下"]
    ];

    function loadProject() {
      var st = FZStore.read();
      var p = FZStore.findProject(st, id);
      if (!p && (isNoviceEditTour() || id === NOVICE_DEMO_ID)) {
        id = NOVICE_DEMO_ID;
        if (!noviceDemoProject) noviceDemoProject = makeNoviceDemoProject();
        return { st: st, p: noviceDemoProject, noviceDemo: true };
      }
      if (!p) {
        location.href = "./projects.html";
        return null;
      }
      if (!p.boundChannels) p.boundChannels = [];
      if (!p.optionalPacks) p.optionalPacks = {};
      FZProjectUnion.normalizeProject(p);
      FZArticle.ensureWatermarks(p);
      FZArticle.ensureArticle(p);
      return { st: st, p: p };
    }

    function copyText(text, label) {
      function ok() {
        FZShell.toast((label || "内容") + "已复制", "ok");
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(ok).catch(function () {
          FZShell.toast("复制失败", "err");
        });
      } else ok();
    }

    function kvRow(label, value, copyId) {
      var v = value || "—";
      return (
        '<div class="kv-row">' +
        '<div class="kv-meta"><div class="kv-label">' +
        label +
        '</div><div class="kv-value" id="' +
        copyId +
        '">' +
        v +
        "</div></div>" +
        (value
          ? '<button type="button" class="btn" data-copy-text="' +
            copyId +
            '" data-label="' +
            label +
            '">复制</button>'
          : "") +
        "</div>"
      );
    }

    function posRadios(name, selected) {
      return (
        '<div class="pos-group">' +
        POS.map(function (pair) {
          return (
            '<label><input type="radio" name="' +
            name +
            '" value="' +
            pair[0] +
            '"' +
            (selected === pair[0] ? " checked" : "") +
            " /> " +
            pair[1] +
            "</label>"
          );
        }).join("") +
        "</div>"
      );
    }

    function posChecks(name, selected) {
      selected = selected || [];
      return (
        '<div class="pos-group">' +
        POS.map(function (pair) {
          return (
            '<label><input type="checkbox" data-pos-group="' +
            name +
            '" value="' +
            pair[0] +
            '"' +
            (selected.indexOf(pair[0]) !== -1 ? " checked" : "") +
            " /> " +
            pair[1] +
            "</label>"
          );
        }).join("") +
        "</div>"
      );
    }

    function wmBlock(key, title, accept, multiPos, extraHtml) {
      var ctx = loadProject();
      var w = ctx.p.watermarks[key];
      var preview = w.dataUrl
        ? accept.indexOf("video") !== -1 && w.dataUrl.indexOf("video") !== -1
          ? '<video src="' + w.dataUrl + '" muted></video>'
          : '<img src="' + w.dataUrl + '" alt="" />'
        : "未上传";
      return (
        '<div class="wm-card" data-wm="' +
        key +
        '"><h3>' +
        title +
        "</h3>" +
        '<div style="display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start">' +
        '<div class="wm-preview" id="prev-' +
        key +
        '">' +
        preview +
        "</div>" +
        "<div style=\"flex:1;min-width:220px\">" +
        '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">' +
        '<label class="btn">' +
        (accept.indexOf("image") !== -1 && accept.indexOf("video") === -1
          ? "上传图片"
          : "上传素材") +
        '<input type="file" accept="' +
        accept +
        '" data-upload="' +
        key +
        '" hidden /></label>' +
        '<button type="button" class="btn btn-ghost" data-remove-wm="' +
        key +
        '">移除水印</button></div>' +
        '<div class="muted" style="font-size:12px;margin-bottom:8px">' +
        (w.name ? "已加载：" + w.name : "尚未上传") +
        "</div>" +
        "<div class=\"field\" style=\"margin:0 0 8px\"><label>位置" +
        (multiPos ? "（多选）" : "") +
        "</label>" +
        (multiPos ? posChecks(key, w.positions) : posRadios("pos-" + key, w.position)) +
        "</div>" +
        (extraHtml || "") +
        '<div class="field" style="margin:0"><label>宽度比例（0.02~1，留空走默认）</label>' +
        '<div class="ratio-row">' +
        '<div class="field"><label>横屏</label><input data-ratio="' +
        key +
        '-h" value="' +
        (w.ratioH || "") +
        '" placeholder="如 0.2" /></div>' +
        '<div class="field"><label>竖屏</label><input data-ratio="' +
        key +
        '-v" value="' +
        (w.ratioV || "") +
        '" placeholder="如 0.2" /></div></div></div>' +
        "</div></div></div>"
      );
    }

    function renderHero(p) {
      var st = FZStore.projectStatusLabel(p);
      var typeLabel = FZProjectUnion.siteTypeLabel(p.siteType);
      var channelHint = p.apiBaseUrl
        ? "已配接口 · " + (p.contentActivated ? "已接通" : "待接通")
        : p.contentActivated
          ? "已接通（待补接口）"
          : "待配对接 / 待接通";
      var botN = FZStore.projectUserbotIds(p).length;
      var chN = FZStore.projectChannels(p).length;
      var actionsOpt = "";
      if (!usingNoviceDemo()) {
        if (p.status === "pending_activate") {
          actionsOpt =
            '<a class="btn" href="./project-connect.html?id=' +
            encodeURIComponent(p.id) +
            '">对接</a>';
        } else if (botN === 0) {
          actionsOpt =
            '<button type="button" class="btn" id="btn-hero-add-bot">添加采集号</button>';
        } else if (chN === 0 || p.status === "need_collect") {
          actionsOpt =
            '<a class="btn" href="./tg-collect.html?project=' +
            encodeURIComponent(p.id) +
            '" title="去 TG 采集配置里绑定源频道">绑定频道</a>';
        }
      }
      document.getElementById("topbar-cta").innerHTML = "";
      return (
        '<div class="detail-hero">' +
        '<div class="detail-hero-top">' +
        "<div><div class=\"detail-hero-title\">" +
        "<h2>" +
        (p.name || "未命名项目") +
        '</h2><span class="tag ' +
        st.cls +
        '">' +
        st.text +
        "</span></div>" +
        '<div class="muted" style="font-size:13px">只读摘要。名称 / 类型 / 封面请点「编辑基本信息」；下方配置 Tab 操作即生效。一个项目 = 一套内容通道；推送带上子账号「CMS 标识」。</div></div>' +
        '<div class="proj-actions detail-hero-actions">' +
        '<div class="fz-actions-opt">' +
        actionsOpt +
        '</div><div class="fz-actions-fix">' +
        '<button type="button" class="btn btn-primary" id="btn-edit-basic">编辑基本信息</button>' +
        "</div></div></div>" +
        '<div class="detail-meta">' +
        '<div><div class="label">站点类型</div><div class="value">' +
        typeLabel +
        "</div></div>" +
        '<div><div class="label">文章封面</div><div class="value">' +
        (p.coverWidth || "—") +
        " × " +
        (p.coverHeight || "—") +
        " · " +
        ({ 1: "单拼图", 2: "二拼图", 3: "三拼图" }[Number(p.coverPanelCount)] ||
          "三拼图") +
        "</div></div>" +
        '<div><div class="label">视频封面策略</div><div class="value">' +
        ({
          article: "文章封面",
          first_frame: "视频首帧",
          random: "随机抽帧"
        }[p.videoCoverStrategy] || "文章封面") +
        "</div></div>" +
        '<div><div class="label">采集号</div><div class="value">' +
        (FZStore.projectUserbotIds(p).length
          ? FZStore.projectUserbotIds(p).length + " 个"
          : "未配置") +
        "</div></div>" +
        '<div><div class="label">已绑频道</div><div class="value">' +
        FZStore.projectChannels(p).length +
        " 个</div></div>" +
        '<div><div class="label">内容通道</div><div class="value">' +
        channelHint +
        "</div></div>" +
        '<div><div class="label">App ID</div><div class="value" style="font-family:ui-monospace,monospace;font-size:12px">' +
        ((p.creds && p.creds.appId) || "—") +
        "</div></div></div></div>"
      );
    }

    function renderTabs(p) {
      return (
        '<div class="config-tabs">' +
        tabsForProject(p)
          .map(function (t) {
            return (
              '<button type="button" class="btn' +
              (tab === t.id ? " btn-primary" : "") +
              '" data-tab="' +
              t.id +
              '">' +
              t.label +
              "</button>"
            );
          })
          .join("") +
        "</div>"
      );
    }

    function paneWatermark(p) {
      return (
        '<div class="card card-pad">' +
        FZMediaConfig.renderWatermarkPanel(p.watermarks, {
          allowDefault: false,
          showSave: false,
          dewatermarkEnabled: p.dewatermarkEnabled !== false,
          dewatermarkImage: p.dewatermarkImage,
          dewatermarkVideo: p.dewatermarkVideo,
          dewatermarkMove: p.dewatermarkMove,
          dewatermarkFixed: p.dewatermarkFixed,
          showDewatermark: true,
          wmAddView: wmAddView
        }) +
        "</div>"
      );
    }

    function paneIntro(p) {
      return (
        '<div class="card card-pad">' +
        FZMediaConfig.renderIntroOutroPanel(p.watermarks, {
          showSave: false
        }) +
        "</div>"
      );
    }

    function paneArticle(p) {
      if (!FZProjectUnion.needsArticle(p.siteType)) {
        return (
          '<div class="card card-pad">' +
          '<p class="muted" style="margin:0;font-size:13px">短剧站不配文案管理。分集与出站门槛在「推送规则」；图片编码 / 边下边播在「内容生成规则」。</p></div>'
        );
      }
      return (
        '<div class="card card-pad">' +
        FZMediaConfig.renderArticlePanel(p.article, {
          showSave: false,
          showLinks: true,
          artSection: artSection,
          artView: artView
        }) +
        "</div>"
      );
    }

    function paneConnect(p) {
      var c = p.creds || {};
      return (
        '<div class="card card-pad" style="margin-bottom:14px">' +
        '<div class="cfg-card-head"><div class="cfg-card-title">① 方舟签发凭证</div>' +
        '<div class="cfg-card-sub">给对方对接方舟用 · 只读复制</div></div>' +
        '<div class="kv-block kv-block--row3">' +
        kvRow("App ID", c.appId, "c-appid") +
        kvRow("App Secret", c.appSecret, "c-secret") +
        kvRow("站点代码", p.siteCode || "—", "c-scode") +
        "</div>" +
        (p.status === "pending_activate"
          ? '<a class="btn" style="margin-top:12px" href="./project-connect.html?id=' +
            encodeURIComponent(p.id) +
            '">打开开发对接页</a>'
          : "") +
        "</div>" +
        '<div class="card card-pad" style="margin-bottom:14px">' +
        '<div class="cfg-card-head"><div class="cfg-card-title">② 开发对接文档</div>' +
        '<div class="cfg-card-sub">协议与示例见独立文档 · 本 Tab 不内嵌正文</div></div>' +
        '<button type="button" class="btn" id="btn-dev-docs">查看开发对接文档</button>' +
        "</div>" +
        '<div class="card card-pad" id="union-connect-root">' +
        '<div class="cfg-card-head"><div class="cfg-card-title">③ 对方反填（收件与事件通知）</div>' +
        '<div class="cfg-card-sub">推送身份用子账号「CMS 标识」，不配对方登录账号</div></div>' +
        FZProjectUnion.renderConnectFields(p) +
        "</div>"
      );
    }

    function paneMedia(p) {
      return (
        '<div class="card card-pad" id="union-media-root">' +
        FZProjectUnion.renderVideoRulesFields(p) +
        "</div>"
      );
    }

    function paneChannel(p, st) {
      var lim = FZStore.botLimits();
      var bots = FZStore.botsForProject(st, p.id);
      var tgHref =
        "./tg-collect.html?project=" + encodeURIComponent(p.id);
      var cards =
        bots.length === 0
          ? '<p class="ch-empty">本项目还没有采集号。可在此新建；挂频道、连接/监听请到「采集中心 → TG 采集」。</p>'
          : '<div class="fz-card-grid ch-bot-cards">' +
            bots
              .map(function (b) {
                var lab = FZStore.userbotStatusLabel(b);
                var chs = (p.boundChannels || []).filter(function (c) {
                  return c.botId === b.id;
                });
                var connected = b.status === "connected" || b.status === "ok";
                var markCls = connected
                  ? "is-on"
                  : b.status === "disabled"
                    ? "is-off"
                    : "is-warn";
                return (
                  '<article class="ub-card">' +
                  '<div class="ub-card-top">' +
                  '<div class="ub-mark ' +
                  markCls +
                  '">采</div>' +
                  '<div class="ub-main">' +
                  '<h3 class="ub-title">' +
                  b.name +
                  "</h3>" +
                  '<p class="ub-status ' +
                  markCls +
                  '">' +
                  lab.text +
                  (b.monitoring ? " · 监听中" : " · 未监听") +
                  "</p>" +
                  '<p class="ub-phone">' +
                  (b.phoneHint || "") +
                  "</p>" +
                  '<p class="ub-stats">已挂 ' +
                  chs.length +
                  " / " +
                  lim.maxChannelsPerBot +
                  " 个频道</p>" +
                  "</div></div>" +
                  '<div class="ub-actions">' +
                  '<div class="fz-actions-opt">' +
                  '<button type="button" class="btn" data-detach-bot="' +
                  b.id +
                  '">移出本项目</button></div>' +
                  '<div class="fz-actions-fix">' +
                  '<a class="btn btn-primary" href="' +
                  tgHref +
                  "&bot=" +
                  encodeURIComponent(b.id) +
                  '">去采集配置</a></div></div></article>'
                );
              })
              .join("") +
            "</div>";
      return (
        '<div class="ch-wrap">' +
        '<div class="ch-sec-head" style="margin-bottom:12px">' +
        "<div><div class=\"cfg-card-title\">TG 采集号</div>" +
        '<p class="ch-sec-sub">本项目 ' +
        bots.length +
        " / " +
        lim.maxBotsPerProject +
        " 个 · 频道与连接/监听在「采集中心 → TG 采集」</p></div>" +
        '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
        '<button type="button" class="btn btn-create" id="btn-new-bot">+ 添加采集号</button>' +
        '<a class="btn" href="' +
        tgHref +
        '">打开 TG 采集</a></div></div>' +
        cards +
        "</div>"
      );
    }

    function paneFlow(p) {
      return (
        '<div class="card card-pad" id="union-flow-root">' +
        FZProjectUnion.renderPushRulesFields(p) +
        "</div>"
      );
    }

    function paneOptional(p) {
      return (
        '<div class="card card-pad">' +
        FZArticle.OPTIONAL_PACKS.map(function (pack) {
          var on = !!(p.optionalPacks && p.optionalPacks[pack.id]);
          return (
            '<div class="opt-card"><div><div style="font-weight:600">' +
            pack.name +
            (on ? ' <span class="tag tag-ok">已标记开通</span>' : "") +
            '</div><div class="muted" style="font-size:12.5px;margin-top:4px">' +
            pack.desc +
            '</div></div><button type="button" class="btn" data-opt="' +
            pack.id +
            '">' +
            (on ? "管理配置" : "开通") +
            "</button></div>"
          );
        }).join("") +
        "</div>"
      );
    }

    function render() {
      var ctx = loadProject();
      if (!ctx) return;
      var p = ctx.p;
      var st = ctx.st;
      var visible = tabsForProject(p);
      if (!visible.some(function (t) { return t.id === tab; })) {
        tab = visible[0] ? visible[0].id : "watermark";
        history.replaceState(null, "", editPageUrl(tab));
      }
      var body = "";
      if (tab === "watermark") body = paneWatermark(p);
      else if (tab === "intro") body = paneIntro(p);
      else if (tab === "article") body = paneArticle(p);
      else if (tab === "connect") body = paneConnect(p);
      else if (tab === "media") body = paneMedia(p);
      else if (tab === "channel") body = paneChannel(p, st);
      else if (tab === "flow") body = paneFlow(p);
      else body = paneOptional(p);

      document.getElementById("root").innerHTML =
        renderHero(p) +
        (ctx.noviceDemo
          ? '<p class="hint" style="margin:0 0 12px">教程演示项目 · 操作不会写入真实项目列表</p>'
          : "") +
        renderTabs(p) +
        body;
      bind();
    }

    /**
     * @param {function} mutator
     * @param {{ okMsg?: string, toast?: boolean, rerender?: boolean, toastKind?: string }} [opts]
     * 配置 Tab：操作即生效 → toast 可关、默认不整页重绘（避免输入失焦）
     */
    function persistProject(mutator, opts) {
      opts = opts || {};
      var doToast = opts.toast !== false;
      var doRender = !!opts.rerender;
      var st = FZStore.read();
      if (usingNoviceDemo()) {
        if (!noviceDemoProject) noviceDemoProject = makeNoviceDemoProject();
        FZArticle.ensureWatermarks(noviceDemoProject);
        FZArticle.ensureArticle(noviceDemoProject);
        mutator(noviceDemoProject, st);
        if (doToast) {
          FZShell.toast(
            (opts.okMsg || "已更新") + "（教程演示，未写入真实项目）",
            opts.toastKind || "ok"
          );
        }
        if (doRender) render();
        return;
      }
      var p = FZStore.findProject(st, id);
      FZArticle.ensureWatermarks(p);
      FZArticle.ensureArticle(p);
      mutator(p, st);
      FZStore.upsertProject(st, p);
      FZStore.write(st);
      if (doToast) FZShell.toast(opts.okMsg || "已更新", opts.toastKind || "ok");
      if (doRender) render();
    }

    /** 需刷新 UI 的写操作（上传、增删链接等） */
    function saveProject(mutator, okMsg) {
      persistProject(mutator, { okMsg: okMsg || "已保存", toast: true, rerender: true });
    }

    var configSaveTimer = null;
    function scheduleConfigPersist(mutator, okMsg) {
      clearTimeout(configSaveTimer);
      configSaveTimer = setTimeout(function () {
        persistProject(mutator, {
          okMsg: okMsg || "已更新",
          toast: true,
          rerender: false
        });
      }, 320);
    }

    function bind() {
      document.querySelectorAll("[data-tab]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          tab = btn.getAttribute("data-tab");
          history.replaceState(null, "", editPageUrl(tab));
          render();
        });
      });
      document.querySelectorAll("[data-copy-text]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var el = document.getElementById(btn.getAttribute("data-copy-text"));
          copyText((el && el.textContent) || "", btn.getAttribute("data-label"));
        });
      });

      var eb = document.getElementById("btn-edit-basic");
      if (eb) {
        eb.addEventListener("click", function () {
          var p = loadProject().p;
          document.getElementById("b-name").value = p.name || "";
          fillBasicSiteTypes(p.siteType || "chigua");
          document.getElementById("b-cw").value = p.coverWidth || "720";
          document.getElementById("b-ch").value = p.coverHeight || "1280";
          var panel = String(
            FZMediaConfig.clampCoverPanelCount
              ? FZMediaConfig.clampCoverPanelCount(p.coverPanelCount)
              : p.coverPanelCount || 3
          );
          FZMediaConfig.setSegValue(document.getElementById("basic-modal"), "b-panel", panel);
          FZMediaConfig.setSegValue(
            document.getElementById("basic-modal"),
            "b-vcs",
            p.videoCoverStrategy || "article"
          );
          FZMediaConfig.bindSegControls(document.getElementById("basic-modal"));
          document.getElementById("basic-modal").hidden = false;
        });
      }
      var heroAddBot = document.getElementById("btn-hero-add-bot");
      if (heroAddBot) {
        heroAddBot.addEventListener("click", function () {
          tab = "channel";
          history.replaceState(null, "", editPageUrl(tab));
          render();
        });
      }

      function persistWmForm() {
        scheduleConfigPersist(function (p) {
          var dewmS = FZMediaConfig.collectDewatermarkStrategies(document);
          if (dewmS) FZMediaConfig.applyDewatermarkStrategies(p, dewmS);
          FZMediaConfig.applyWatermarkForm(p.watermarks, document);
          var wav = document.getElementById("wm-add-view");
          if (wav) wmAddView = wav.value || "image";
        }, "水印已更新");
      }

      var connectRoot = document.getElementById("union-connect-root");
      if (connectRoot) {
        function persistConnect() {
          var draft = {};
          FZProjectUnion.collectConnect(document, draft);
          var err = FZProjectUnion.validateConnect(draft);
          if (err) {
            FZShell.toast(err, "err");
            return;
          }
          scheduleConfigPersist(function (p) {
            FZProjectUnion.collectConnect(document, p);
            p.webhook = !!p.webhookUrl;
          }, "对接配置已更新");
        }
        connectRoot.querySelectorAll("input, select, textarea").forEach(function (el) {
          el.addEventListener("change", persistConnect);
          el.addEventListener("input", persistConnect);
        });
      }
      var docsBtn = document.getElementById("btn-dev-docs");
      if (docsBtn) {
        docsBtn.addEventListener("click", function () {
          var docsUrl = "";
          if (!docsUrl) {
            FZShell.toast("开发对接文档暂未配置，请联系管理员", "err");
            return;
          }
          window.open(docsUrl, "_blank", "noopener");
        });
      }

      function persistMedia() {
        scheduleConfigPersist(function (p) {
          FZProjectUnion.collectVideoRules(document, p);
        }, "内容生成规则已更新");
      }
      var mediaRoot = document.getElementById("union-media-root");
      if (mediaRoot) {
        mediaRoot.querySelectorAll("input, select").forEach(function (el) {
          el.addEventListener("change", persistMedia);
        });
      }

      var wmRoot = document.querySelector("[data-media-wm]");
      if (wmRoot) {
        FZMediaConfig.bindWatermarkUI(wmRoot, {
          onSubChange: function (which) {
            wmAddView = which;
          },
          onFormChange: persistWmForm,
          onUpload: function (key, file) {
            var reader = new FileReader();
            reader.onload = function () {
              var wav = document.getElementById("wm-add-view");
              if (wav) wmAddView = wav.value || "image";
              saveProject(function (p) {
                if (FZArticle.ensureWatermarks) FZArticle.ensureWatermarks(p);
                FZMediaConfig.applyWmUpload(p.watermarks, key, file, reader.result);
              }, "已加载素材");
            };
            reader.readAsDataURL(file);
          },
          onRemove: function (key) {
            saveProject(function (p) {
              if (FZArticle.ensureWatermarks) FZArticle.ensureWatermarks(p);
              FZMediaConfig.clearWmUpload(p.watermarks, key);
            }, "已清除");
          }
        });
      }

      var ioRoot = document.querySelector("[data-media-io]");
      if (ioRoot) {
        FZMediaConfig.bindIntroOutroUI(ioRoot, {
          onUpload: function (key, file) {
            var reader = new FileReader();
            reader.onload = function () {
              saveProject(function (p) {
                if (FZArticle.ensureWatermarks) FZArticle.ensureWatermarks(p);
                FZMediaConfig.applyWmUpload(p.watermarks, key, file, reader.result);
              }, "片头/片尾已加载");
            };
            reader.readAsDataURL(file);
          },
          onRemove: function (key) {
            saveProject(function (p) {
              if (FZArticle.ensureWatermarks) FZArticle.ensureWatermarks(p);
              FZMediaConfig.clearWmUpload(p.watermarks, key);
            }, "已清除");
          }
        });
      }

      var artRoot = document.querySelector("[data-media-art]");
      if (artRoot) {
        function persistArtForm() {
          var draft = FZMediaConfig.readArticleForm(document);
          var ctx = loadProject();
          draft.templates = ((ctx && ctx.p.article && ctx.p.article.templates) || []).map(
            function (t) {
              return {
                id: t.id,
                on: Object.prototype.hasOwnProperty.call(draft.tplOns, t.id)
                  ? draft.tplOns[t.id]
                  : t.on
              };
            }
          );
          var err = FZMediaConfig.validateArticle(draft);
          if (err) return;
          scheduleConfigPersist(function (p) {
            FZMediaConfig.applyArticleForm(p.article, document);
          }, "文案配置已更新");
        }
        FZMediaConfig.bindArticleUI(artRoot, {
          onChange: function () {
            var s = document.getElementById("art-section");
            if (s) artSection = s.value || "prompt";
            var v = document.getElementById("art-view");
            if (v) artView = v.value || "custom";
          },
          onFormChange: persistArtForm,
          onAddLink: function () {
            artSection = "links";
            var kw = ((document.getElementById("link-kw") || {}).value || "").trim();
            var url = ((document.getElementById("link-url") || {}).value || "").trim();
            if (!kw || !url) {
              FZShell.toast("请填写关键词和链接", "err");
              return;
            }
            if (!/^https?:\/\//i.test(url)) {
              FZShell.toast("链接需以 http/https 开头", "err");
              return;
            }
            saveProject(function (p) {
              if (!p.article.links) p.article.links = [];
              var hit = p.article.links.find(function (l) {
                return l.kw === kw;
              });
              if (hit) hit.url = url;
              else p.article.links.push({ kw: kw, url: url });
              p.article.linkOn = true;
            }, "链接已保存");
          },
          onDelLink: function (i) {
            artSection = "links";
            saveProject(function (p) {
              p.article.links.splice(i, 1);
              p.article.linkOn = p.article.links.length > 0;
            }, "已删除链接");
          }
        });
      }

      /* TG 采集号：展示 + 新建；频道操作去采集配置 */
      document.querySelectorAll("[data-detach-bot]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var bid = btn.getAttribute("data-detach-bot");
          var ctx = loadProject();
          var still = (ctx.p.boundChannels || []).some(function (c) {
            return c.botId === bid;
          });
          if (still) {
            FZShell.toast(
              "该采集号仍挂有频道。请先到「采集中心 → TG 采集」解绑后再移出",
              "err"
            );
            return;
          }
          saveProject(function (p, st) {
            FZStore.detachBotFromProject(st, p, bid);
          }, "已从本项目移出采集号");
        });
      });
      var nb = document.getElementById("btn-new-bot");
      if (nb) nb.addEventListener("click", openNewBot);

      function persistFlow() {
        scheduleConfigPersist(function (p) {
          FZProjectUnion.collectPushRules(document, p);
          if (p.contentActivated) p.status = FZStore.deriveStatus(p);
        }, "推送规则已更新");
      }
      var flowRoot = document.getElementById("union-flow-root");
      if (flowRoot) {
        flowRoot.querySelectorAll("input, select, textarea").forEach(function (el) {
          el.addEventListener("change", persistFlow);
          el.addEventListener("input", persistFlow);
        });
      }

      FZMediaConfig.bindSegControls(document.getElementById("root"), function (name) {
        var n = String(name || "");
        if (n.indexOf("to-edit") !== -1 || n.indexOf("push-mode") !== -1) {
          persistFlow();
        } else if (n.indexOf("img-fmt") !== -1) {
          persistMedia();
        }
      });
      FZProjectUnion.bindConfigSwitches(document.getElementById("root"), function (sid) {
        var n = String(sid || "");
        if (n.indexOf("slice") !== -1) persistMedia();
        else if (n.indexOf("req-video") !== -1 || n.indexOf("episodes") !== -1) {
          persistFlow();
        }
      });

      document.querySelectorAll("[data-opt]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          FZShell.toast(
            (btn.textContent || "可选功能") + " · 设计中（本期仅保留开通入口）",
            "err"
          );
        });
      });
    }

    function openNewBot() {
      var st0 = FZStore.read();
      var block = FZStore.addBotToProjectBlockReason(st0, id);
      if (block) {
        FZShell.toast(block, "err");
        return;
      }
      FZTgWizard.open({
        onSuccess: function (bot) {
          var st = FZStore.read();
          var p = FZStore.findProject(st, id);
          var again = FZStore.addBotToProjectBlockReason(st, id);
          if (again) {
            FZShell.toast(again, "err");
            return;
          }
          if (!st.userbots) st.userbots = [];
          bot.status = bot.status || "connected";
          st.userbots.push(bot);
          FZStore.attachBotToProject(st, p, bot);
          FZStore.upsertProject(st, p);
          FZStore.write(st);
          FZShell.toast("采集号已添加到本项目", "ok");
          render();
        }
      });
    }

    function fillBasicSiteTypes(selected) {
      var mount = document.getElementById("basic-site-types");
      if (!mount) return;
      mount.innerHTML = FZProjectUnion.renderSiteTypeCards(selected || "chigua", "b-type");
      FZProjectUnion.bindSiteTypeCards(document.getElementById("basic-modal"));
    }

    function notifyBasicDone() {
      if (window.FZNoviceTours) FZNoviceTours.notify("edit_project", "basic_done");
    }
    document.getElementById("basic-cancel").addEventListener("click", function () {
      document.getElementById("basic-modal").hidden = true;
      notifyBasicDone();
    });
    document.getElementById("basic-modal").addEventListener("click", function (e) {
      if (e.target === e.currentTarget) {
        document.getElementById("basic-modal").hidden = true;
        notifyBasicDone();
      }
    });

    document.getElementById("basic-save").addEventListener("click", function () {
      var name = (document.getElementById("b-name").value || "").trim();
      if (!name) {
        FZShell.toast("请填写项目名称", "err");
        return;
      }
      var nextType = (document.getElementById("b-type") || {}).value || "chigua";
      var coverDraft = {
        coverWidth: document.getElementById("b-cw").value,
        coverHeight: document.getElementById("b-ch").value
      };
      var coverErr = FZProjectUnion.validateCover(coverDraft);
      if (coverErr) {
        FZShell.toast(coverErr, "err");
        return;
      }
      var prevType = (loadProject().p || {}).siteType;
      if (prevType && prevType !== nextType) {
        var ok = confirm(
          "将站点类型改为「" +
            FZProjectUnion.siteTypeLabel(nextType) +
            "」？\n\n" +
            "• 会按新类型调整后续默认规则（如短剧分集、是否配文案管理）。\n" +
            "• 已生成的历史文章/素材不会自动重跑或改写。\n" +
            "• 未完成队列仍按新类型规则继续处理。"
        );
        if (!ok) return;
      }
      saveProject(function (p) {
        var prev = p.siteType;
        p.name = name;
        p.siteType = nextType;
        p.coverWidth = String(Number(coverDraft.coverWidth) || 720);
        p.coverHeight = String(Number(coverDraft.coverHeight) || 1280);
        p.coverAspect = "";
        var panelVal = FZMediaConfig.readSeg(
          document.getElementById("basic-modal"),
          "b-panel"
        );
        p.coverPanelCount = FZMediaConfig.clampCoverPanelCount(panelVal);
        p.videoCoverStrategy =
          FZMediaConfig.readSeg(document.getElementById("basic-modal"), "b-vcs") ||
          "article";
        if (prev !== nextType) FZProjectUnion.applyTypeDefaults(p, nextType);
      }, prevType !== nextType ? "基本信息已保存（类型已变更）" : "基本信息已保存");
      document.getElementById("basic-modal").hidden = true;
      notifyBasicDone();
    });

    /* 捕获文章保存时至少启用一套模板 */
    var _save = saveProject;
    saveProject = function (mutator, okMsg) {
      try {
        _save(function (p, st) {
          mutator(p, st);
          if (
            p.article &&
            p.article.templateOn &&
            !p.article.templates.some(function (x) {
              return x.on;
            })
          ) {
            throw new Error("tpl");
          }
        }, okMsg);
      } catch (e) {
        if (e && e.message === "tpl") {
          FZShell.toast("模板提示词已打开，请至少启用一套结构", "err");
          return;
        }
        throw e;
      }
    };

    render();
  </script>
</body>
</html>
