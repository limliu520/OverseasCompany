<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>项目详情 · 方舟</title>
  <link rel="stylesheet" href="../css/app.css?v=20261031doneFix" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <div class="topbar">
        <div style="display:flex;align-items:center;gap:12px;min-width:0">
          <a class="btn" href="./projects.html">← 项目列表</a>
          <h1 style="margin:0">项目详情</h1>
        </div>
        <div class="topbar-actions" id="topbar-cta"></div>
      </div>
      <div class="content" id="root"><p class="muted">加载中…</p></div>
    </div>
  </div>

  <div class="modal-mask" id="basic-modal" hidden>
    <div class="modal" style="width:min(640px,100%)">
      <h2>编辑基本信息</h2>
      <p class="hint" style="margin-top:0">展示与编辑分离：名称、类型与封面宽高在此修改（生成与推送同一套）。一个项目一套内容通道。</p>
      <div class="field"><label>项目名称 *</label><input id="b-name" /></div>
      <div class="field"><label>站点类型</label>
        <div id="basic-site-types"></div>
        <p class="hint" id="b-type-hint" style="margin-top:8px">创建后仍可改。改类型只影响后续出稿/分集等规则，已产出的历史稿不会自动重跑或改写。</p>
      </div>
      <div class="field"><label>图片封面尺寸（生成与推送共用，200–4096px）</label>
        <div class="ratio-row">
          <div class="field"><label>宽 (px)</label><input id="b-cw" /></div>
          <div class="field"><label>高 (px)</label><input id="b-ch" /></div>
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="basic-cancel">取消</button>
        <button type="button" class="btn btn-primary" id="basic-save">保存</button>
      </div>
    </div>
  </div>

  <script src="../js/store.js?v=20261031demoPerm"></script>
  <script src="../js/shell.js?v=20261031fabDragFast"></script>
  <script src="../js/novice-guide.js?v=20261031tour7"></script>
  <script src="../js/novice-tour-kit.js?v=20261031doneFix"></script>
  <script src="../js/novice-tours.js?v=20261031doneFix"></script>
  <script src="../js/article-defaults.js?v=20261028wmFx2"></script>
  <script src="../js/media-config.js?v=20261028ioLR1"></script>
  <script src="../js/pick-cards.js"></script>
  <script src="../js/tg-add-wizard.js?v=20261028tipAll"></script>
  <script src="../js/project-union.js?v=20261028tipAll"></script>
  <script>
    FZShell.boot({ active: "projects" });
    var id = new URLSearchParams(location.search).get("id");
    var tab = new URLSearchParams(location.search).get("tab") || "watermark";
    var wmAddView = "image";
    var artSection = "prompt";
    var artView = "custom";
    var ALL_TABS = [
      { id: "watermark", label: "水印管理" },
      { id: "intro", label: "片头和片尾" },
      { id: "article", label: "文章管理" },
      { id: "media", label: "图片视频规则" },
      { id: "connect", label: "开发对接配置" },
      { id: "channel", label: "TG 采集号" },
      { id: "flow", label: "推送规则" },
      { id: "optional", label: "可选功能" }
    ];
    /** 短剧站不展示「文章管理」（与创建向导 needsArticle 一致） */
    function tabsForProject(p) {
      return ALL_TABS.filter(function (t) {
        if (t.id === "article") return FZProjectUnion.needsArticle(p && p.siteType);
        return true;
      });
    }
    if (!ALL_TABS.some(function (t) { return t.id === tab; })) tab = "watermark";
    var POS = [
      ["top-left", "左上"],
      ["top-right", "右上"],
      ["bottom-left", "左下"],
      ["bottom-right", "右下"]
    ];

    function loadProject() {
      var st = FZStore.read();
      var p = FZStore.findProject(st, id);
      if (!p) {
        location.href = "./projects.html";
        return null;
      }
      if (!p.boundChannels) p.boundChannels = [];
      if (!p.optionalPacks) p.optionalPacks = {};
      FZProjectUnion.normalizeProject(p);
      FZArticle.ensureWatermarks(p);
      FZArticle.ensureArticle(p);
      return { st: st, p: p };
    }

    function copyText(text, label) {
      function ok() {
        FZShell.toast((label || "内容") + "已复制", "ok");
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(ok).catch(function () {
          FZShell.toast("复制失败", "err");
        });
      } else ok();
    }

    function kvRow(label, value, copyId) {
      var v = value || "—";
      return (
        '<div class="kv-row">' +
        '<div class="kv-meta"><div class="kv-label">' +
        label +
        '</div><div class="kv-value" id="' +
        copyId +
        '">' +
        v +
        "</div></div>" +
        (value
          ? '<button type="button" class="btn" data-copy-text="' +
            copyId +
            '" data-label="' +
            label +
            '">复制</button>'
          : "") +
        "</div>"
      );
    }

    function posRadios(name, selected) {
      return (
        '<div class="pos-group">' +
        POS.map(function (pair) {
          return (
            '<label><input type="radio" name="' +
            name +
            '" value="' +
            pair[0] +
            '"' +
            (selected === pair[0] ? " checked" : "") +
            " /> " +
            pair[1] +
            "</label>"
          );
        }).join("") +
        "</div>"
      );
    }

    function posChecks(name, selected) {
      selected = selected || [];
      return (
        '<div class="pos-group">' +
        POS.map(function (pair) {
          return (
            '<label><input type="checkbox" data-pos-group="' +
            name +
            '" value="' +
            pair[0] +
            '"' +
            (selected.indexOf(pair[0]) !== -1 ? " checked" : "") +
            " /> " +
            pair[1] +
            "</label>"
          );
        }).join("") +
        "</div>"
      );
    }

    function wmBlock(key, title, accept, multiPos, extraHtml) {
      var ctx = loadProject();
      var w = ctx.p.watermarks[key];
      var preview = w.dataUrl
        ? accept.indexOf("video") !== -1 && w.dataUrl.indexOf("video") !== -1
          ? '<video src="' + w.dataUrl + '" muted></video>'
          : '<img src="' + w.dataUrl + '" alt="" />'
        : "未上传";
      return (
        '<div class="wm-card" data-wm="' +
        key +
        '"><h3>' +
        title +
        "</h3>" +
        '<div style="display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start">' +
        '<div class="wm-preview" id="prev-' +
        key +
        '">' +
        preview +
        "</div>" +
        "<div style=\"flex:1;min-width:220px\">" +
        '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">' +
        '<label class="btn">' +
        (accept.indexOf("image") !== -1 && accept.indexOf("video") === -1
          ? "上传图片"
          : "上传素材") +
        '<input type="file" accept="' +
        accept +
        '" data-upload="' +
        key +
        '" hidden /></label>' +
        '<button type="button" class="btn btn-ghost" data-remove-wm="' +
        key +
        '">移除水印</button></div>' +
        '<div class="muted" style="font-size:12px;margin-bottom:8px">' +
        (w.name ? "已加载：" + w.name : "尚未上传") +
        "</div>" +
        "<div class=\"field\" style=\"margin:0 0 8px\"><label>位置" +
        (multiPos ? "（多选）" : "") +
        "</label>" +
        (multiPos ? posChecks(key, w.positions) : posRadios("pos-" + key, w.position)) +
        "</div>" +
        (extraHtml || "") +
        '<div class="field" style="margin:0"><label>宽度比例（0.02~1，留空走默认）</label>' +
        '<div class="ratio-row">' +
        '<div class="field"><label>横屏</label><input data-ratio="' +
        key +
        '-h" value="' +
        (w.ratioH || "") +
        '" placeholder="如 0.2" /></div>' +
        '<div class="field"><label>竖屏</label><input data-ratio="' +
        key +
        '-v" value="' +
        (w.ratioV || "") +
        '" placeholder="如 0.2" /></div></div></div>' +
        "</div></div></div>"
      );
    }

    function renderHero(p) {
      var st = FZStore.projectStatusLabel(p);
      var typeLabel = FZProjectUnion.siteTypeLabel(p.siteType);
      var channelHint = p.apiBaseUrl
        ? "已配接口 · " + (p.contentActivated ? "已接通" : "待接通")
        : p.contentActivated
          ? "已接通（待补接口）"
          : "待配对接 / 待接通";
      document.getElementById("topbar-cta").innerHTML =
        '<span class="tag ' +
        st.cls +
        '">' +
        st.text +
        "</span>" +
        (p.status === "pending_activate"
          ? '<a class="btn btn-primary" href="./project-connect.html?id=' +
            encodeURIComponent(p.id) +
            '">去对接</a>'
          : "");
      return (
        '<div class="detail-hero">' +
        '<div class="detail-hero-top">' +
        "<div><h2>" +
        (p.name || "未命名项目") +
        '</h2><div class="muted" style="font-size:13px">只读摘要。修改请点「编辑基本信息」或下方各 Tab 内保存。一个项目 = 一套内容通道（方舟规范对接）；推送带上子账号「CMS 标识」，不做多账号分发。</div></div>' +
        '<button type="button" class="btn btn-primary" id="btn-edit-basic">编辑基本信息</button></div>' +
        '<div class="detail-meta">' +
        '<div><div class="label">站点类型</div><div class="value">' +
        typeLabel +
        "</div></div>" +
        '<div><div class="label">封面</div><div class="value">' +
        (p.coverWidth || "—") +
        " × " +
        (p.coverHeight || "—") +
        " px</div></div>" +
        '<div><div class="label">采集号</div><div class="value">' +
        (FZStore.projectUserbotIds(p).length
          ? FZStore.projectUserbotIds(p).length + " 个"
          : "未配置") +
        "</div></div>" +
        '<div><div class="label">已绑频道</div><div class="value">' +
        FZStore.projectChannels(p).length +
        " 个</div></div>" +
        '<div><div class="label">内容通道</div><div class="value">' +
        channelHint +
        "</div></div>" +
        '<div><div class="label">App ID</div><div class="value" style="font-family:ui-monospace,monospace;font-size:12px">' +
        ((p.creds && p.creds.appId) || "—") +
        "</div></div></div></div>"
      );
    }

    function renderTabs(p) {
      return (
        '<div class="config-tabs">' +
        tabsForProject(p)
          .map(function (t) {
            return (
              '<button type="button" class="btn' +
              (tab === t.id ? " btn-primary" : "") +
              '" data-tab="' +
              t.id +
              '">' +
              t.label +
              "</button>"
            );
          })
          .join("") +
        "</div>"
      );
    }

    function paneWatermark(p) {
      return (
        '<div class="card card-pad">' +
        FZMediaConfig.renderWatermarkPanel(p.watermarks, {
          lead: "上下同级两块：去源水印、添加水印（图片 / 视频叠层）。片头片尾见「片头和片尾」Tab。",
          allowDefault: false,
          showSave: true,
          dewatermarkEnabled: p.dewatermarkEnabled !== false,
          showDewatermark: true,
          wmAddView: wmAddView
        }) +
        "</div>"
      );
    }

    function paneIntro(p) {
      return (
        '<div class="card card-pad">' +
        FZMediaConfig.renderIntroOutroPanel(p.watermarks, {
          lead: "整段拼在原片前/后，不是叠层水印。有上传才拼接；可只配一端。",
          showSave: true
        }) +
        "</div>"
      );
    }

    function paneArticle(p) {
      if (!FZProjectUnion.needsArticle(p.siteType)) {
        return (
          '<div class="card card-pad">' +
          '<p class="muted" style="margin:0;font-size:13px">短剧站不配文章管理。分集在「推送规则」，闸门在「图片视频规则」。</p></div>'
        );
      }
      return (
        '<div class="card card-pad">' +
        FZMediaConfig.renderArticlePanel(p.article, {
          lead: "顶栏切换「AI 文章提示词管理 / 文案内链管理」。提示词默认优先自定义；点卡片切换，开关开才展开（可同开，不可同关）。文案内链独立，与提示词无关。",
          showSave: true,
          showLinks: true,
          artSection: artSection,
          artView: artView
        }) +
        "</div>"
      );
    }

    function paneToolbar(lead, saveId, saveLabel) {
      return (
        '<div class="tab-pane-toolbar">' +
        '<p class="muted media-lead" style="margin:0">' +
        lead +
        "</p>" +
        '<button type="button" class="btn btn-primary tab-pane-save" id="' +
        saveId +
        '">' +
        saveLabel +
        "</button></div>"
      );
    }

    function paneConnect(p) {
      var c = p.creds || {};
      return (
        '<div class="card card-pad" style="margin-bottom:14px">' +
        paneToolbar(
          "开发联调用：方舟签发凭证 + 对方收件接口 / 事件通知地址。运营创建时不填；推送身份用子账号「CMS 标识」，不配对方登录账号。",
          "btn-save-connect",
          "保存对接配置"
        ) +
        '<div class="kv-block">' +
        kvRow("App ID", c.appId, "c-appid") +
        kvRow("App Secret", c.appSecret, "c-secret") +
        "</div>" +
        (p.status === "pending_activate"
          ? '<a class="btn" style="margin-top:12px" href="./project-connect.html?id=' +
            encodeURIComponent(p.id) +
            '">打开开发对接页</a>'
          : "") +
        "</div>" +
        '<div class="card card-pad" id="union-connect-root">' +
        "<strong style=\"display:block;margin-bottom:10px\">对方收件与事件通知</strong>" +
        FZProjectUnion.renderConnectFields(p) +
        "</div>"
      );
    }

    function paneMedia(p) {
      return (
        '<div class="card card-pad" id="union-media-root">' +
        paneToolbar(
          "左栏图片输出格式；右栏必须含视频、切片、最短时长。分集在「推送规则」。封面在「编辑基本信息」，水印在「水印管理」。",
          "btn-save-media",
          "保存图片视频规则"
        ) +
        FZProjectUnion.renderVideoRulesFields(p) +
        "</div>"
      );
    }

    function paneChannel(p, st) {
      var lim = FZStore.botLimits();
      var bots = FZStore.botsForProject(st, p.id);
      var tgHref =
        "./tg-collect.html?project=" + encodeURIComponent(p.id);
      var cards =
        bots.length === 0
          ? '<p class="ch-empty">本项目还没有采集号。可在此新建；挂频道、连接/监听请到「采集中心 → TG 采集」。</p>'
          : '<div class="fz-card-grid ch-bot-cards">' +
            bots
              .map(function (b) {
                var lab = FZStore.userbotStatusLabel(b);
                var chs = (p.boundChannels || []).filter(function (c) {
                  return c.botId === b.id;
                });
                var connected = b.status === "connected" || b.status === "ok";
                var markCls = connected
                  ? "is-on"
                  : b.status === "disabled"
                    ? "is-off"
                    : "is-warn";
                return (
                  '<article class="ub-card">' +
                  '<div class="ub-card-top">' +
                  '<div class="ub-mark ' +
                  markCls +
                  '">采</div>' +
                  '<div class="ub-main">' +
                  '<h3 class="ub-title">' +
                  b.name +
                  "</h3>" +
                  '<p class="ub-status ' +
                  markCls +
                  '">' +
                  lab.text +
                  (b.monitoring ? " · 监听中" : " · 未监听") +
                  "</p>" +
                  '<p class="ub-phone">' +
                  (b.phoneHint || "") +
                  "</p>" +
                  '<p class="ub-stats">已挂 ' +
                  chs.length +
                  " / " +
                  lim.maxChannelsPerBot +
                  " 个频道</p>" +
                  "</div></div>" +
                  '<div class="ub-actions">' +
                  '<a class="btn btn-primary" href="' +
                  tgHref +
                  "&bot=" +
                  encodeURIComponent(b.id) +
                  '">去采集配置</a>' +
                  '<button type="button" class="btn btn-ghost" data-detach-bot="' +
                  b.id +
                  '">移出本项目</button></div></article>'
                );
              })
              .join("") +
            "</div>";
      return (
        '<div class="ch-wrap">' +
        '<div class="ch-sec-head" style="margin-bottom:12px">' +
        "<div><p class=\"ch-lead\" style=\"margin:0\">本页只展示采集号核心信息（状态、挂载数）。频道明细与连接/监听请到「采集中心 → TG 采集」。此处可新建采集号。</p>" +
        '<p class="ch-sec-sub">本项目 ' +
        bots.length +
        " / " +
        lim.maxBotsPerProject +
        " 个</p></div>" +
        '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
        '<button type="button" class="btn btn-primary" id="btn-new-bot">+ 添加采集号</button>' +
        '<a class="btn" href="' +
        tgHref +
        '">打开 TG 采集</a></div></div>' +
        cards +
        "</div>"
      );
    }

    function paneFlow(p) {
      return (
        '<div class="card card-pad" id="union-flow-root">' +
        paneToolbar(
          "两段分开配：① 素材要不要自动进编辑；② 编辑就绪后要不要自动推业务方。短剧站还可配分集。对接地址在「开发对接配置」。",
          "btn-save-flow",
          "保存推送规则"
        ) +
        FZProjectUnion.renderPushRulesFields(p) +
        "</div>"
      );
    }

    function paneOptional(p) {
      return (
        '<div class="card card-pad">' +
        '<p class="muted" style="margin:0 0 14px;font-size:13px">项目可开通下列可选能力。本期点「开通」仅提示设计中，入口必须可见。</p>' +
        FZArticle.OPTIONAL_PACKS.map(function (pack) {
          var on = !!(p.optionalPacks && p.optionalPacks[pack.id]);
          return (
            '<div class="opt-card"><div><div style="font-weight:600">' +
            pack.name +
            (on ? ' <span class="tag tag-ok">已标记开通</span>' : "") +
            '</div><div class="muted" style="font-size:12.5px;margin-top:4px">' +
            pack.desc +
            '</div></div><button type="button" class="btn" data-opt="' +
            pack.id +
            '">' +
            (on ? "管理配置" : "开通") +
            "</button></div>"
          );
        }).join("") +
        "</div>"
      );
    }

    function render() {
      var ctx = loadProject();
      if (!ctx) return;
      var p = ctx.p;
      var st = ctx.st;
      var visible = tabsForProject(p);
      if (!visible.some(function (t) { return t.id === tab; })) {
        tab = visible[0] ? visible[0].id : "watermark";
        history.replaceState(
          null,
          "",
          "./project-edit.html?id=" + encodeURIComponent(id) + "&tab=" + tab
        );
      }
      var body = "";
      if (tab === "watermark") body = paneWatermark(p);
      else if (tab === "intro") body = paneIntro(p);
      else if (tab === "article") body = paneArticle(p);
      else if (tab === "connect") body = paneConnect(p);
      else if (tab === "media") body = paneMedia(p);
      else if (tab === "channel") body = paneChannel(p, st);
      else if (tab === "flow") body = paneFlow(p);
      else body = paneOptional(p);

      document.getElementById("root").innerHTML =
        renderHero(p) + renderTabs(p) + body;
      bind();
    }

    function saveProject(mutator, okMsg) {
      var st = FZStore.read();
      var p = FZStore.findProject(st, id);
      FZArticle.ensureWatermarks(p);
      FZArticle.ensureArticle(p);
      mutator(p, st);
      FZStore.upsertProject(st, p);
      FZStore.write(st);
      FZShell.toast(okMsg || "已保存", "ok");
      render();
    }

    function bind() {
      document.querySelectorAll("[data-tab]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          tab = btn.getAttribute("data-tab");
          history.replaceState(
            null,
            "",
            "./project-edit.html?id=" + encodeURIComponent(id) + "&tab=" + tab
          );
          render();
        });
      });
      document.querySelectorAll("[data-copy-text]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var el = document.getElementById(btn.getAttribute("data-copy-text"));
          copyText((el && el.textContent) || "", btn.getAttribute("data-label"));
        });
      });

      var eb = document.getElementById("btn-edit-basic");
      if (eb) {
        eb.addEventListener("click", function () {
          var p = loadProject().p;
          document.getElementById("b-name").value = p.name || "";
          fillBasicSiteTypes(p.siteType || "chigua");
          document.getElementById("b-cw").value = p.coverWidth || "720";
          document.getElementById("b-ch").value = p.coverHeight || "1280";
          document.getElementById("basic-modal").hidden = false;
        });
      }

      var saveConnect = document.getElementById("btn-save-connect");
      if (saveConnect) {
        saveConnect.addEventListener("click", function () {
          var draft = {};
          FZProjectUnion.collectConnect(document, draft);
          var err = FZProjectUnion.validateConnect(draft);
          if (err) {
            FZShell.toast(err, "err");
            return;
          }
          saveProject(function (p) {
            FZProjectUnion.collectConnect(document, p);
            p.webhook = !!p.webhookUrl;
          }, "对接配置已保存");
        });
      }
      var saveMedia = document.getElementById("btn-save-media");
      if (saveMedia) {
        saveMedia.addEventListener("click", function () {
          saveProject(function (p) {
            FZProjectUnion.collectVideoRules(document, p);
          }, "图片视频规则已保存");
        });
      }

      var wmRoot = document.querySelector("[data-media-wm]");
      if (wmRoot) {
        FZMediaConfig.bindWatermarkUI(wmRoot, {
          onSubChange: function (which) {
            wmAddView = which;
          },
          onUpload: function (key, file) {
            var reader = new FileReader();
            reader.onload = function () {
              var wav = document.getElementById("wm-add-view");
              if (wav) wmAddView = wav.value || "image";
              saveProject(function (p) {
                if (FZArticle.ensureWatermarks) FZArticle.ensureWatermarks(p);
                FZMediaConfig.applyWmUpload(p.watermarks, key, file, reader.result);
              }, "已加载素材");
            };
            reader.readAsDataURL(file);
          },
          onRemove: function (key) {
            saveProject(function (p) {
              if (FZArticle.ensureWatermarks) FZArticle.ensureWatermarks(p);
              FZMediaConfig.clearWmUpload(p.watermarks, key);
            }, "已清除");
          }
        });
        var swm = document.getElementById("btn-save-wm");
        if (swm) {
          swm.addEventListener("click", function () {
            saveProject(function (p) {
              var dewm = FZMediaConfig.collectDewatermark(document);
              if (dewm != null) p.dewatermarkEnabled = dewm;
              FZMediaConfig.applyWatermarkForm(p.watermarks, document);
              var wav = document.getElementById("wm-add-view");
              if (wav) wmAddView = wav.value || "image";
            }, "水印配置已保存");
          });
        }
      }

      var ioRoot = document.querySelector("[data-media-io]");
      if (ioRoot) {
        FZMediaConfig.bindIntroOutroUI(ioRoot, {
          onUpload: function (key, file) {
            var reader = new FileReader();
            reader.onload = function () {
              saveProject(function (p) {
                if (FZArticle.ensureWatermarks) FZArticle.ensureWatermarks(p);
                FZMediaConfig.applyWmUpload(p.watermarks, key, file, reader.result);
              }, "片头/片尾已加载");
            };
            reader.readAsDataURL(file);
          },
          onRemove: function (key) {
            saveProject(function (p) {
              if (FZArticle.ensureWatermarks) FZArticle.ensureWatermarks(p);
              FZMediaConfig.clearWmUpload(p.watermarks, key);
            }, "已清除");
          }
        });
        var sio = document.getElementById("btn-save-io");
        if (sio) {
          sio.addEventListener("click", function () {
            saveProject(function (p) {
              if (FZArticle.ensureWatermarks) FZArticle.ensureWatermarks(p);
              FZMediaConfig.syncIntroOutroEnabled(p.watermarks);
            }, "片头片尾已保存");
          });
        }
      }

      var artRoot = document.querySelector("[data-media-art]");
      if (artRoot) {
        FZMediaConfig.bindArticleUI(artRoot, {
          onChange: function () {
            var s = document.getElementById("art-section");
            if (s) artSection = s.value || "prompt";
            var v = document.getElementById("art-view");
            if (v) artView = v.value || "custom";
          },
          onAddLink: function () {
            artSection = "links";
            var kw = ((document.getElementById("link-kw") || {}).value || "").trim();
            var url = ((document.getElementById("link-url") || {}).value || "").trim();
            if (!kw || !url) {
              FZShell.toast("请填写关键词和链接", "err");
              return;
            }
            if (!/^https?:\/\//i.test(url)) {
              FZShell.toast("链接需以 http/https 开头", "err");
              return;
            }
            saveProject(function (p) {
              if (!p.article.links) p.article.links = [];
              var hit = p.article.links.find(function (l) {
                return l.kw === kw;
              });
              if (hit) hit.url = url;
              else p.article.links.push({ kw: kw, url: url });
              p.article.linkOn = true;
            }, "链接已保存");
          },
          onDelLink: function (i) {
            artSection = "links";
            saveProject(function (p) {
              p.article.links.splice(i, 1);
              p.article.linkOn = p.article.links.length > 0;
            }, "已删除链接");
          }
        });
        var saveArt = document.getElementById("btn-save-art");
        if (saveArt) {
          saveArt.addEventListener("click", function () {
            var draft = FZMediaConfig.readArticleForm(document);
            draft.templates = (loadProject().p.article.templates || []).map(function (t) {
              return {
                id: t.id,
                on: Object.prototype.hasOwnProperty.call(draft.tplOns, t.id)
                  ? draft.tplOns[t.id]
                  : t.on
              };
            });
            var err = FZMediaConfig.validateArticle(draft);
            if (err) {
              FZShell.toast(err, "err");
              return;
            }
            saveProject(function (p) {
              FZMediaConfig.applyArticleForm(p.article, document);
            }, "提示词配置已保存");
          });
        }
      }

      /* TG 采集号：展示 + 新建；频道操作去采集配置 */
      document.querySelectorAll("[data-detach-bot]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var bid = btn.getAttribute("data-detach-bot");
          var ctx = loadProject();
          var still = (ctx.p.boundChannels || []).some(function (c) {
            return c.botId === bid;
          });
          if (still) {
            FZShell.toast(
              "该采集号仍挂有频道。请先到「采集中心 → TG 采集」解绑后再移出",
              "err"
            );
            return;
          }
          saveProject(function (p, st) {
            FZStore.detachBotFromProject(st, p, bid);
          }, "已从本项目移出采集号");
        });
      });
      var nb = document.getElementById("btn-new-bot");
      if (nb) nb.addEventListener("click", openNewBot);

      var sf = document.getElementById("btn-save-flow");
      if (sf)
        sf.addEventListener("click", function () {
          saveProject(function (p) {
            FZProjectUnion.collectPushRules(document, p);
            if (p.contentActivated) p.status = FZStore.deriveStatus(p);
          }, "已保存");
        });

      document.querySelectorAll("[data-opt]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          FZShell.toast(
            (btn.textContent || "可选功能") + " · 设计中（本期仅保留开通入口）",
            "err"
          );
        });
      });
    }

    function openNewBot() {
      var st0 = FZStore.read();
      var block = FZStore.addBotToProjectBlockReason(st0, id);
      if (block) {
        FZShell.toast(block, "err");
        return;
      }
      FZTgWizard.open({
        onSuccess: function (bot) {
          var st = FZStore.read();
          var p = FZStore.findProject(st, id);
          var again = FZStore.addBotToProjectBlockReason(st, id);
          if (again) {
            FZShell.toast(again, "err");
            return;
          }
          if (!st.userbots) st.userbots = [];
          bot.status = bot.status || "connected";
          st.userbots.push(bot);
          FZStore.attachBotToProject(st, p, bot);
          FZStore.upsertProject(st, p);
          FZStore.write(st);
          FZShell.toast("采集号已添加到本项目", "ok");
          render();
        }
      });
    }

    function fillBasicSiteTypes(selected) {
      var mount = document.getElementById("basic-site-types");
      if (!mount) return;
      mount.innerHTML = FZProjectUnion.renderSiteTypeCards(selected || "chigua", "b-type");
      FZProjectUnion.bindSiteTypeCards(document.getElementById("basic-modal"));
    }

    function notifyBasicDone() {
      if (window.FZNoviceTours) FZNoviceTours.notify("edit_project", "basic_done");
    }
    document.getElementById("basic-cancel").addEventListener("click", function () {
      document.getElementById("basic-modal").hidden = true;
      notifyBasicDone();
    });
    document.getElementById("basic-modal").addEventListener("click", function (e) {
      if (e.target === e.currentTarget) {
        document.getElementById("basic-modal").hidden = true;
        notifyBasicDone();
      }
    });

    document.getElementById("basic-save").addEventListener("click", function () {
      var name = (document.getElementById("b-name").value || "").trim();
      if (!name) {
        FZShell.toast("请填写项目名称", "err");
        return;
      }
      var nextType = (document.getElementById("b-type") || {}).value || "chigua";
      var coverDraft = {
        coverWidth: document.getElementById("b-cw").value,
        coverHeight: document.getElementById("b-ch").value
      };
      var coverErr = FZProjectUnion.validateCover(coverDraft);
      if (coverErr) {
        FZShell.toast(coverErr, "err");
        return;
      }
      var prevType = (loadProject().p || {}).siteType;
      if (prevType && prevType !== nextType) {
        var ok = confirm(
          "将站点类型改为「" +
            FZProjectUnion.siteTypeLabel(nextType) +
            "」？\n\n" +
            "• 会按新类型调整后续默认规则（如短剧分集、是否配文章管理）。\n" +
            "• 已生成的历史文章/素材不会自动重跑或改写。\n" +
            "• 未完成队列仍按新类型规则继续处理。"
        );
        if (!ok) return;
      }
      saveProject(function (p) {
        var prev = p.siteType;
        p.name = name;
        p.siteType = nextType;
        p.coverWidth = String(Number(coverDraft.coverWidth) || 720);
        p.coverHeight = String(Number(coverDraft.coverHeight) || 1280);
        p.coverAspect = "";
        if (prev !== nextType) FZProjectUnion.applyTypeDefaults(p, nextType);
      }, prevType !== nextType ? "基本信息已保存（类型已变更）" : "基本信息已保存");
      document.getElementById("basic-modal").hidden = true;
      notifyBasicDone();
    });

    /* 捕获文章保存时至少启用一套模板 */
    var _save = saveProject;
    saveProject = function (mutator, okMsg) {
      try {
        _save(function (p, st) {
          mutator(p, st);
          if (
            p.article &&
            p.article.templateOn &&
            !p.article.templates.some(function (x) {
              return x.on;
            })
          ) {
            throw new Error("tpl");
          }
        }, okMsg);
      } catch (e) {
        if (e && e.message === "tpl") {
          FZShell.toast("模板提示词已打开，请至少启用一套结构", "err");
          return;
        }
        throw e;
      }
    };

    render();
  </script>
</body>
</html>
