<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>创建项目 · 方舟</title>
  <link rel="stylesheet" href="../css/app.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <div class="topbar">
        <h1>创建项目</h1>
        <div class="topbar-actions" id="top-user"></div>
      </div>
      <div class="content">
        <p class="muted" style="margin:0 0 16px">
          先填写<strong>不依赖对接测通</strong>的信息并创建。创建后进入对接页生成凭证；测通激活后，再配置自动流等依赖对接的项。
        </p>
        <div class="wizard-layout">
          <nav class="steps" id="steps"></nav>
          <section class="card wizard-panel">
            <div id="panel"></div>
            <div class="wizard-foot">
              <button type="button" class="btn btn-ghost" id="btn-prev">上一步</button>
              <div style="display:flex;gap:8px">
                <button type="button" class="btn" id="btn-skip">跳过</button>
                <button type="button" class="btn btn-primary" id="btn-next">下一步</button>
              </div>
            </div>
          </section>
          <aside class="card card-pad ready-card">
            <h3>本阶段说明</h3>
            <p class="hint" style="margin:0">
              可选功能开通不在新建流程。外站可「待激活」仍挂到本项目，列表会标（待激活）。水印/模板字段二期补全，本期保留配置位。
            </p>
            <div id="summary" style="margin-top:12px;font-size:12.5px;line-height:1.6"></div>
          </aside>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-mask" id="asset-modal" hidden>
    <div class="modal" style="width:min(480px,100%)">
      <h2 id="asset-title">新建</h2>
      <div id="asset-body"></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="asset-cancel">取消</button>
        <button type="button" class="btn btn-primary" id="asset-save">创建</button>
      </div>
    </div>
  </div>

  <script src="../js/store.js"></script>
  <script src="../js/shell.js"></script>
  <script>
    FZShell.boot({ active: "project_new" });
    if (new URLSearchParams(location.search).get("new") !== "1") {
      /* 允许无 new 参数也当新建 */
    }

    var STEPS = [
      { id: "basic", title: "基本信息", required: true },
      { id: "userbot", title: "Userbot" },
      { id: "ext", title: "外站通道" },
      { id: "media", title: "水印 / 封面 / 模板" }
    ];

    var draft = {
      name: "",
      siteType: "chigua",
      marquee: "",
      userbotId: "",
      userbotName: "",
      attachedExtIds: [],
      watermarkDone: false,
      templateDone: false,
      coverNote: ""
    };

    var stepIndex = 0;
    var assetMode = "";

    function renderSteps() {
      document.getElementById("steps").innerHTML = STEPS.map(function (st, i) {
        var cls = "step" + (i === stepIndex ? " active" : i < stepIndex ? " done" : "");
        return (
          '<button type="button" class="' +
          cls +
          '" data-i="' +
          i +
          '"><span class="step-num">' +
          (i + 1) +
          "</span><span>" +
          st.title +
          (st.required ? " *" : "") +
          "</span></button>"
        );
      }).join("");
      document.querySelectorAll("#steps [data-i]").forEach(function (b) {
        b.addEventListener("click", function () {
          collect();
          stepIndex = Number(b.getAttribute("data-i"));
          render();
        });
      });
    }

    function renderSummary() {
      var st = FZStore.read();
      var extNames = draft.attachedExtIds
        .map(function (id) {
          var e = st.extChannels.find(function (x) {
            return x.id === id;
          });
          if (!e) return null;
          var mark = e.status === "active" ? "" : "（待激活）";
          return e.name + mark;
        })
        .filter(Boolean);
      document.getElementById("summary").innerHTML =
        "<div>名称：" +
        (draft.name || "未填") +
        "</div><div>Userbot：" +
        (draft.userbotName || "未选") +
        "</div><div>外站：" +
        (extNames.join("、") || "未挂") +
        "</div><div>水印位：" +
        (draft.watermarkDone ? "已留位确认" : "未确认") +
        "</div><div>模板位：" +
        (draft.templateDone ? "已留位确认" : "未确认") +
        "</div>";
    }

    function panelBasic() {
      return (
        "<h2 style=\"margin:0 0 8px;font-size:18px\">基本信息</h2>" +
        '<p class="muted" style="margin:0 0 14px">创建前必填。项目专属 Token 在点击「创建项目」之后才会生成。</p>' +
        '<div class="field"><label>项目名称 *</label><input id="f-name" value="' +
        draft.name +
        '" placeholder="例如：出海内容站 A" /></div>' +
        '<div class="field"><label>站点类型</label><select id="f-type">' +
        '<option value="chigua"' +
        (draft.siteType === "chigua" ? " selected" : "") +
        ">内容站</option>" +
        '<option value="video"' +
        (draft.siteType === "video" ? " selected" : "") +
        ">视频站</option></select></div>" +
        '<div class="field"><label>跑马灯文案（可选）</label><input id="f-marquee" value="' +
        (draft.marquee || "") +
        '" placeholder="线网字段：卡片展示用，可空" />' +
        '<p class="hint">线网项目里有此字段，目前只存库与列表展示，无业务逻辑消费；用不上可留空。</p></div>'
      );
    }

    function panelUserbot() {
      var st = FZStore.read();
      var bots = (st._bots || []).concat(
        draft.userbotId
          ? [{ id: draft.userbotId, name: draft.userbotName }]
          : []
      );
      /* session bots on draft */
      var list = window.__bots || [];
      var options =
        '<option value="">— 请选择 —</option>' +
        list
          .map(function (b) {
            return (
              '<option value="' +
              b.id +
              '"' +
              (draft.userbotId === b.id ? " selected" : "") +
              ">" +
              b.name +
              "</option>"
            );
          })
          .join("");
      return (
        "<h2 style=\"margin:0 0 8px;font-size:18px\">Userbot</h2>" +
        '<p class="muted" style="margin:0 0 14px">优先选择；可在本步弹窗新建。完整短信/二步验证流程二期可再细化，本期按真实字段填写并模拟成功。</p>' +
        '<div class="field"><label>选用 Userbot</label><select id="f-bot">' +
        options +
        "</select></div>" +
        '<button type="button" class="btn" id="btn-new-bot">新建 Userbot</button>'
      );
    }

    function panelExt() {
      var st = FZStore.read();
      var boxes = (st.extChannels || [])
        .map(function (e) {
          var on = draft.attachedExtIds.indexOf(e.id) !== -1;
          var tag = e.status === "active" ? "" : "（待激活）";
          return (
            '<label class="check-item"><input type="checkbox" data-ext="' +
            e.id +
            '"' +
            (on ? " checked" : "") +
            " /> " +
            e.name +
            " " +
            tag +
            "</label>"
          );
        })
        .join("");
      return (
        "<h2 style=\"margin:0 0 8px;font-size:18px\">外站通道</h2>" +
        '<p class="muted" style="margin:0 0 14px">可新建通道（创建后为待激活，并生成对接文档入口）。待激活也可挂到本项目，界面会标「待激活」。激活催办在待办，不挡建项。</p>' +
        '<div id="ext-list">' +
        (boxes || '<p class="muted">暂无外站通道</p>') +
        "</div>" +
        '<button type="button" class="btn" id="btn-new-ext" style="margin-top:12px">新建外站通道</button>'
      );
    }

    function panelMedia() {
      return (
        "<h2 style=\"margin:0 0 8px;font-size:18px\">水印 / 封面 / 文章模板</h2>" +
        '<p class="muted" style="margin:0 0 14px">不依赖对接测通，应在创建时完成。具体选项二期项目配置梳理后补全；本期保留配置位，需确认已审视。</p>' +
        '<div class="placeholder-doc" style="text-align:left;margin-bottom:12px">' +
        "<strong>水印与封面（配置位）</strong>" +
        "<ul style=\"margin:8px 0 0;padding-left:18px;color:var(--muted);font-size:13px\">" +
        "<li>图片水印槽位 / 位置 / 比例</li>" +
        "<li>视频水印规则</li>" +
        "<li>封面宽高</li></ul>" +
        '<label class="check-item" style="margin-top:10px"><input type="checkbox" id="f-wm"' +
        (draft.watermarkDone ? " checked" : "") +
        " /> 已确认将在此配置水印与封面（演示占位）</label></div>" +
        '<div class="placeholder-doc" style="text-align:left">' +
        "<strong>文章模板（配置位）</strong>" +
        "<ul style=\"margin:8px 0 0;padding-left:18px;color:var(--muted);font-size:13px\">" +
        "<li>模板启用与权重</li>" +
        "<li>结构模板 / 长度策略</li></ul>" +
        '<label class="check-item" style="margin-top:10px"><input type="checkbox" id="f-tpl"' +
        (draft.templateDone ? " checked" : "") +
        " /> 已确认将在此配置文章模板（演示占位）</label></div>"
      );
    }

    function collect() {
      var id = STEPS[stepIndex].id;
      if (id === "basic") {
        draft.name = (document.getElementById("f-name") || {}).value || "";
        draft.siteType = (document.getElementById("f-type") || {}).value || "chigua";
        draft.marquee = (document.getElementById("f-marquee") || {}).value || "";
      }
      if (id === "userbot") {
        var sel = document.getElementById("f-bot");
        if (sel) {
          draft.userbotId = sel.value;
          var opt = sel.options[sel.selectedIndex];
          draft.userbotName = draft.userbotId ? opt.text : "";
        }
      }
      if (id === "ext") {
        draft.attachedExtIds = [];
        document.querySelectorAll("[data-ext]").forEach(function (el) {
          if (el.checked) draft.attachedExtIds.push(el.getAttribute("data-ext"));
        });
      }
      if (id === "media") {
        draft.watermarkDone = !!(document.getElementById("f-wm") || {}).checked;
        draft.templateDone = !!(document.getElementById("f-tpl") || {}).checked;
      }
    }

    function bind() {
      var nb = document.getElementById("btn-new-bot");
      if (nb) nb.addEventListener("click", function () { openAsset("bot"); });
      var ne = document.getElementById("btn-new-ext");
      if (ne) ne.addEventListener("click", function () { openAsset("ext"); });
    }

    function openAsset(mode) {
      assetMode = mode;
      document.getElementById("asset-modal").hidden = false;
      document.getElementById("asset-title").textContent =
        mode === "bot" ? "新建 Userbot" : "新建外站通道";
      if (mode === "bot") {
        document.getElementById("asset-body").innerHTML =
          '<div class="field"><label>显示名称 *</label><input id="a-name" placeholder="例如：采集号-主" /></div>' +
          '<div class="field"><label>手机号 *</label><input id="a-phone" placeholder="+86 …" /></div>' +
          '<div class="field"><label>api_id</label><input id="a-api" placeholder="Telegram api_id" /></div>' +
          '<div class="field"><label>api_hash</label><input id="a-hash" placeholder="Telegram api_hash" /></div>' +
          '<p class="hint">演示：保存即模拟登录验证成功，不发真短信。</p>';
      } else {
        document.getElementById("asset-body").innerHTML =
          '<div class="field"><label>通道名称 *</label><input id="a-name" placeholder="例如：合作站 X" /></div>' +
          '<div class="field"><label>站点备注</label><input id="a-note" placeholder="对接方名称等" /></div>' +
          '<p class="hint">创建后生成对接文档入口，状态为「待激活」，并自动挂到当前项目。</p>';
      }
    }

    function closeAsset() {
      document.getElementById("asset-modal").hidden = true;
      document.getElementById("asset-body").innerHTML = "";
      assetMode = "";
    }
    document.getElementById("asset-cancel").addEventListener("click", closeAsset);
    document.getElementById("asset-modal").addEventListener("click", function (e) {
      if (e.target === e.currentTarget) closeAsset();
    });
    document.getElementById("asset-save").addEventListener("click", function () {
      if (!assetMode) {
        closeAsset();
        return;
      }
      var name = (document.getElementById("a-name") || {}).value;
      name = (name || "").trim();
      if (!name) {
        FZShell.toast("请填写名称");
        return;
      }
      if (assetMode === "bot") {
        if (!window.__bots) window.__bots = [];
        var bot = { id: FZStore.uid("bot"), name: name };
        window.__bots.push(bot);
        draft.userbotId = bot.id;
        draft.userbotName = name;
        FZShell.toast("Userbot 已创建（模拟验证成功）");
      } else {
        var st = FZStore.read();
        var ext = {
          id: FZStore.uid("ext"),
          name: name,
          note: ((document.getElementById("a-note") || {}).value || "").trim(),
          status: "pending_activate",
          docReady: true
        };
        st.extChannels.push(ext);
        FZStore.write(st);
        if (draft.attachedExtIds.indexOf(ext.id) === -1) draft.attachedExtIds.push(ext.id);
        FZShell.toast("外站通道已创建（待激活），并已挂到本项目");
      }
      closeAsset();
      render();
    });

    function createProject() {
      collect();
      if (!draft.name.trim()) {
        stepIndex = 0;
        render();
        FZShell.toast("请填写项目名称");
        return;
      }
      var st = FZStore.read();
      var id = FZStore.uid("p");
      var project = {
        id: id,
        name: draft.name.trim(),
        siteType: draft.siteType,
        marquee: draft.marquee,
        status: "pending_activate",
        creds: FZStore.issueProjectCreds(id),
        contentActivated: false,
        attachedExtIds: draft.attachedExtIds.slice(),
        userbotId: draft.userbotId,
        userbotName: draft.userbotName,
        watermarkDone: draft.watermarkDone,
        templateDone: draft.templateDone,
        autoflow: false,
        hasCollectSource: false
      };
      var wasEmpty = !st.projects.length;
      if (wasEmpty) {
        st.projects = FZStore.seedAfterFirstCreate(project);
        st.firstProjectDone = true;
        st.zeroPromptDismissed = true;
      } else {
        st.projects.unshift(project);
      }
      FZStore.write(st);
      location.href = "./project-connect.html?id=" + encodeURIComponent(id);
    }

    function render() {
      var map = {
        basic: panelBasic,
        userbot: panelUserbot,
        ext: panelExt,
        media: panelMedia
      };
      document.getElementById("panel").innerHTML = map[STEPS[stepIndex].id]();
      document.getElementById("btn-prev").disabled = stepIndex === 0;
      document.getElementById("btn-skip").style.display = STEPS[stepIndex].required
        ? "none"
        : "";
      var last = stepIndex === STEPS.length - 1;
      document.getElementById("btn-next").textContent = last ? "创建项目" : "下一步";
      renderSteps();
      renderSummary();
      bind();
    }

    document.getElementById("btn-prev").addEventListener("click", function () {
      collect();
      if (stepIndex > 0) {
        stepIndex--;
        render();
      }
    });
    document.getElementById("btn-skip").addEventListener("click", function () {
      collect();
      if (stepIndex < STEPS.length - 1) {
        stepIndex++;
        render();
      } else createProject();
    });
    document.getElementById("btn-next").addEventListener("click", function () {
      collect();
      if (STEPS[stepIndex].required && !draft.name.trim()) {
        FZShell.toast("请填写项目名称");
        return;
      }
      if (stepIndex < STEPS.length - 1) {
        stepIndex++;
        render();
      } else createProject();
    });

    window.__bots = [];
    render();
  </script>
</body>
</html>
