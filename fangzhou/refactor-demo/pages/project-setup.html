<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>创建项目 · 方舟</title>
  <link rel="stylesheet" href="../css/app.css?v=20261027tipBr" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <div class="topbar">
        <h1>创建项目</h1>
        <div class="topbar-actions" id="top-user"></div>
      </div>
      <div class="content">
        <p class="muted" style="margin:0 0 16px">
          两步主路径：① 运营配齐业务配置（类型、采集号、封面/水印/图片视频规则、推送规则等）→ 创建；② 开发对接（凭证 + 通道参数）统一在对接页，接通后前置配置生效。
        </p>
        <div class="wizard-layout">
          <nav class="steps" id="steps"></nav>
          <section class="card wizard-panel">
            <div id="panel"></div>
            <div class="wizard-foot">
              <button type="button" class="btn btn-ghost" id="btn-prev">上一步</button>
              <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end">
                <span class="btn-foot-hint" id="foot-hint"></span>
                <button type="button" class="btn" id="btn-skip">跳过</button>
                <button type="button" class="btn btn-primary" id="btn-next">下一步</button>
              </div>
            </div>
          </section>
          <aside class="card card-pad ready-card">
            <h3>本阶段说明</h3>
            <p class="hint" style="margin:0">
              本向导只配运营侧。通道凭证与对方收件/签名等开发项，创建后在「开发对接」填写。推送规则接通前不生效。
            </p>
            <div id="summary" style="margin-top:12px;font-size:12.5px;line-height:1.6"></div>
          </aside>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-mask" id="success-modal" hidden>
    <div class="modal success-modal" style="width:min(520px,100%)">
      <div class="success-ico" aria-hidden="true">✓</div>
      <h2 id="success-title">创建成功</h2>
      <p id="success-lead"></p>
      <div class="block-list" id="success-blocks"></div>
      <div class="modal-actions" style="margin-top:18px">
        <button type="button" class="btn btn-ghost" id="success-later">稍后对接</button>
        <button type="button" class="btn btn-primary" id="success-go">去开发对接激活</button>
      </div>
    </div>
  </div>

  <script src="../js/store.js?v=20261027botName"></script>
  <script src="../js/shell.js?v=20261027reviewCtr"></script>
  <script src="../js/pick-cards.js"></script>
  <script src="../js/tg-add-wizard.js?v=20261028tipAll"></script>
  <script src="../js/article-defaults.js?v=20261027reviewCtr"></script>
  <script src="../js/media-config.js?v=20261027tipBr"></script>
  <script src="../js/project-union.js?v=20261028tipAll"></script>
  <script src="../js/project-setup-app.js?v=20261027twoGate"></script>
</body>
</html>
