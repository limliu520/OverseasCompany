<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>项目列表 · 方舟</title>
  <link rel="stylesheet" href="../css/app.css?v=20261105novice" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <div class="topbar">
        <h1>项目列表</h1>
        <div class="topbar-actions">
          <div id="top-user"></div>
        </div>
      </div>
      <div class="content content--dock-pager">
        <div class="page-scroll">
          <div class="list-toolbar proj-list-toolbar">
            <div class="list-toolbar-row">
              <input
                class="input"
                id="proj-f-q"
                type="search"
                placeholder="搜索项目名称 / App ID…"
                aria-label="搜索项目"
              />
              <select class="input" id="proj-f-type" aria-label="站点类型">
                <option value="">全部类型</option>
                <option value="chigua">瓜站（内容站）</option>
                <option value="video">视频站</option>
                <option value="short_drama">短剧站</option>
              </select>
              <select class="input" id="proj-f-status" aria-label="项目状态">
                <option value="">全部状态</option>
                <option value="pending_activate">待接通</option>
                <option value="ready">已完成</option>
                <option value="need_collect">缺采集源</option>
              </select>
              <button type="button" class="btn" id="proj-f-search">搜索</button>
              <button type="button" class="btn btn-ghost" id="proj-f-clear">重置</button>
              <div class="list-toolbar-actions">
                <a class="btn btn-create" id="proj-f-new" href="./project-setup.html?new=1">+ 新建项目</a>
              </div>
            </div>
          </div>
          <div class="proj-list proj-card-grid" id="project-list"></div>
        </div>
        <div class="pager-dock" id="project-pager"></div>
      </div>
    </div>
  </div>
  <script src="../js/perm-tree.js?v=20261106view1"></script>
  <script src="../js/article-defaults.js?v=20261028wmFx2"></script>
  <script src="../js/store.js?v=20261106perm2"></script>
  <script src="../js/shell.js?v=20261110noTour1"></script>
  <script src="../js/pager.js?v=20261104rf03"></script>
  <script src="../js/project-union.js?v=20261104rf"></script>
  <script src="../js/novice-guide.js?v=20261031demoEdit"></script>
  <script>
    FZShell.boot({ active: "projects" });
    var COVER_POOL = {
      chigua: [
        "../assets/project-covers/cover-chigua-1.jpg",
        "../assets/project-covers/cover-chigua-2.jpg"
      ],
      video: [
        "../assets/project-covers/cover-video-1.jpg",
        "../assets/project-covers/cover-video-2.jpg"
      ],
      short_drama: [
        "../assets/project-covers/cover-drama-1.jpg",
        "../assets/project-covers/cover-drama-2.jpg"
      ]
    };
    function coverForProject(p, type) {
      var pool = COVER_POOL[type] || COVER_POOL.chigua;
      var key = String((p && p.id) || (p && p.name) || "0");
      var sum = 0;
      for (var i = 0; i < key.length; i++) sum += key.charCodeAt(i);
      return pool[sum % pool.length];
    }
    var list = document.getElementById("project-list");
    var pagerBox = document.getElementById("project-pager");
    var page = 1;
    var pageSize = FZPager.DEFAULT;

    function factRow(label, value, valueCls) {
      if (value == null || value === "") return "";
      return (
        '<div class="proj-fact"><span class="proj-fact-k">' +
        label +
        '</span><span class="proj-fact-v' +
        (valueCls ? " " + valueCls : "") +
        '" title="' +
        String(value).replace(/"/g, "&quot;") +
        '">' +
        value +
        "</span></div>"
      );
    }

    /** 采集号：0 / 1 名 / 多个「N 个 · 名1、名2」或「…等」 */
    function formatCollectBots(p, state) {
      var bots = FZStore.botsForProject
        ? FZStore.botsForProject(state, p.id)
        : [];
      if (!bots.length) {
        var ids = FZStore.projectUserbotIds
          ? FZStore.projectUserbotIds(p)
          : p.userbotIds || (p.userbotId ? [p.userbotId] : []);
        bots = ids
          .map(function (id) {
            return (state.userbots || []).filter(function (b) {
              return b.id === id;
            })[0];
          })
          .filter(Boolean);
      }
      if (!bots.length) {
        if (p.userbotName) return { text: p.userbotName, muted: false, n: 1 };
        return { text: "未关联", muted: true, n: 0 };
      }
      var names = bots.map(function (b) {
        return b.name || b.id;
      });
      if (names.length === 1) return { text: names[0], muted: false, n: 1 };
      if (names.length === 2) {
        return { text: "2 个 · " + names.join("、"), muted: false, n: 2 };
      }
      return {
        text: names.length + " 个 · " + names.slice(0, 2).join("、") + " 等",
        muted: false,
        n: names.length
      };
    }

    /** 推送规则摘要：各类型都有两段闸门；短剧站多「是否推全部分集」 */
    function formatPushRules(p) {
      var parts = [
        p.autoToEdit ? "自动进编辑" : "人工进编辑",
        p.autoPush ? "自动推送" : "确认后推送"
      ];
      if (p.siteType === "short_drama") {
        parts.push(p.pushAllEpisodes ? "推全部分集" : "不全推分集");
      }
      return parts.join(" · ");
    }

    function channelStatus(p) {
      if (p.contentActivated) return { text: "已接通", muted: false };
      return { text: "待接通", muted: true };
    }

    function cardHtml(p, state) {
      FZProjectUnion.normalizeProject(p);
      var st = FZStore.projectStatusLabel(p);
      var type = p.siteType || "chigua";
      var typeLabel = FZProjectUnion.siteTypeLabel(type);
      var chN = FZStore.projectChannels(p).length;
      var appId = (p.creds && p.creds.appId) || "";
      var bots = formatCollectBots(p, state || FZStore.read());
      var chSt = channelStatus(p);
      /* 头图：按站点类型用 Demo 封面池（不再用水印缩略图） */
      var coverUrl = coverForProject(p, type);
      var coverInner =
        '<img class="proj-card-cover-img" src="' +
        coverUrl +
        '" alt="" loading="lazy" />';
      var noviceQ = "";
      try {
        var nq = new URLSearchParams(location.search).get("novice");
        if (nq) noviceQ = "&novice=" + encodeURIComponent(nq);
      } catch (err) {}
      var actionsOpt = "";
      if (p.status === "pending_activate") {
        actionsOpt =
          '<a class="btn" href="./project-connect.html?id=' +
          encodeURIComponent(p.id) +
          '">对接</a>';
      } else if (bots.n === 0) {
        actionsOpt =
          '<a class="btn" href="./project-edit.html?id=' +
          encodeURIComponent(p.id) +
          noviceQ +
          '&tab=channel">添加采集号</a>';
      } else if (chN === 0 || p.status === "need_collect") {
        actionsOpt =
          '<a class="btn" href="./tg-collect.html?project=' +
          encodeURIComponent(p.id) +
          '" title="去 TG 采集配置里绑定源频道">绑定频道</a>';
      }
      var actionsFix =
        '<a class="btn btn-primary" href="./project-edit.html?id=' +
        encodeURIComponent(p.id) +
        noviceQ +
        '">项目详情</a>';
      var actions =
        '<div class="fz-actions-opt">' +
        actionsOpt +
        '</div><div class="fz-actions-fix">' +
        actionsFix +
        "</div>";
      /* 扁平事实行：App ID / 采集号 / 已绑频道 / 内容通道状态 / 推送规则 */
      var facts =
        factRow(
          "App ID",
          appId || "未配置",
          appId ? "is-mono" : "is-muted"
        ) +
        factRow("采集号", bots.text, bots.muted ? "is-muted" : "") +
        factRow("已绑频道", chN + " 个", chN ? "" : "is-muted") +
        factRow("内容通道状态", chSt.text, chSt.muted ? "is-muted" : "") +
        factRow("推送规则", formatPushRules(p));
      return (
        '<article class="proj-card">' +
        '<div class="proj-card-cover">' +
        coverInner +
        '<div class="proj-card-cover-status"><span class="tag ' +
        st.cls +
        '">' +
        st.text +
        "</span></div>" +
        '<div class="proj-card-cover-foot">' +
        '<div class="proj-card-title-row">' +
        '<h2 class="proj-title"><a href="./project-edit.html?id=' +
        encodeURIComponent(p.id) +
        noviceQ +
        '">' +
        p.name +
        "</a></h2>" +
        '<p class="proj-type is-' +
        type +
        '">' +
        typeLabel +
        "</p></div></div></div>" +
        '<div class="proj-card-body">' +
        '<div class="proj-facts proj-facts--flat">' +
        facts +
        "</div>" +
        '<div class="proj-actions">' +
        actions +
        "</div></div></article>"
      );
    }

    var filterQ = "";
    var filterType = "";
    var filterStatus = "";

    function readSearch() {
      filterQ = ((document.getElementById("proj-f-q") || {}).value || "")
        .trim()
        .toLowerCase();
    }
    function readSelectFilters() {
      filterType = (document.getElementById("proj-f-type") || {}).value || "";
      filterStatus = (document.getElementById("proj-f-status") || {}).value || "";
    }

    function matchProject(p) {
      if (filterType && (p.siteType || "chigua") !== filterType) return false;
      if (filterStatus) {
        var st = FZStore.deriveStatus ? FZStore.deriveStatus(p) : p.status;
        if (st !== filterStatus) return false;
      }
      if (filterQ) {
        var name = String(p.name || "").toLowerCase();
        var appId = String((p.creds && p.creds.appId) || "").toLowerCase();
        if (name.indexOf(filterQ) === -1 && appId.indexOf(filterQ) === -1) {
          return false;
        }
      }
      return true;
    }

    function paint() {
      var s = FZStore.read();
      var all = FZStore.businessProjects
        ? FZStore.businessProjects(s)
        : (s.projects || []).filter(function (p) {
            return !p.isPublicPool;
          });
      var canCreate =
        !FZStore.hasFeature || FZStore.hasFeature(s, "projects.list.proj_new");
      var newBtn = document.getElementById("proj-f-new");
      if (newBtn) newBtn.hidden = !canCreate;

      if (!all.length) {
        list.innerHTML =
          '<div class="wb-empty-card wb-empty-card--lg">' +
          "<strong>创建你的第一个项目</strong>" +
          "<p>配齐基本信息与媒体配置后创建，再交给开发对接内容通道。接通后配置自动生效。</p>" +
          (canCreate
            ? '<a class="btn btn-create" href="./project-setup.html?new=1">+ 新建项目</a>'
            : '<p class="muted" style="margin:0">当前角色无新建权限，请联系主账号。</p>') +
          "</div>";
        pagerBox.innerHTML = "";
        return;
      }

      var projects = all.filter(matchProject);
      if (!projects.length) {
        list.innerHTML =
          '<div class="wb-empty-card"><strong>没有匹配的项目</strong>' +
          "<p>试试调整搜索词或筛选条件。</p></div>";
        pagerBox.innerHTML = "";
        return;
      }

      var slice = FZPager.slice(projects, page, pageSize);
      page = slice.page;
      pageSize = slice.pageSize;
      list.innerHTML = slice.items
        .map(function (p) {
          return cardHtml(p, s);
        })
        .join("");
      pagerBox.innerHTML = FZPager.html({
        total: slice.total,
        page: slice.page,
        pageSize: slice.pageSize
      });
    }

    function applySearch() {
      readSearch();
      readSelectFilters();
      page = 1;
      paint();
    }
    function applySelectFilters() {
      readSelectFilters();
      page = 1;
      paint();
    }

    FZPager.bind(pagerBox, {
      getState: function () {
        return { page: page, pageSize: pageSize };
      },
      setState: function (next) {
        if (next.page != null) page = next.page;
        if (next.pageSize != null) pageSize = next.pageSize;
      },
      onChange: paint
    });

    var qEl = document.getElementById("proj-f-q");
    var typeEl = document.getElementById("proj-f-type");
    var statusEl = document.getElementById("proj-f-status");
    var searchBtn = document.getElementById("proj-f-search");
    var clearBtn = document.getElementById("proj-f-clear");
    if (searchBtn) searchBtn.addEventListener("click", applySearch);
    if (typeEl) typeEl.addEventListener("change", applySelectFilters);
    if (statusEl) statusEl.addEventListener("change", applySelectFilters);
    if (qEl) {
      qEl.addEventListener("keydown", function (e) {
        if (e.key === "Enter") {
          e.preventDefault();
          applySearch();
        }
      });
    }
    if (clearBtn) {
      clearBtn.addEventListener("click", function () {
        if (qEl) qEl.value = "";
        if (typeEl) typeEl.value = "";
        if (statusEl) statusEl.value = "";
        filterQ = "";
        filterType = "";
        filterStatus = "";
        page = 1;
        paint();
        FZShell.toast("已重置筛选", "ok");
      });
    }

    paint();
  </script>
</body>
</html>
