<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>项目管理 · 方舟</title>
  <link rel="stylesheet" href="../css/app.css?v=20261031doneFix" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <div class="topbar">
        <h1>项目管理</h1>
        <div class="topbar-actions">
          <a class="btn btn-primary" href="./project-setup.html?new=1">新建项目</a>
          <div id="top-user"></div>
        </div>
      </div>
      <div class="content content--dock-pager">
        <div class="page-scroll">
          <p class="proj-page-lead">
            创建时配齐配置 → 开发接入；接通后即完成。「项目详情」可改信息与查看对接材料；待接通另有对接入口。
          </p>
          <div class="proj-list fz-card-grid" id="project-list"></div>
        </div>
        <div class="pager-dock" id="project-pager"></div>
      </div>
    </div>
  </div>
  <script src="../js/perm-tree.js?v=20261031permNav"></script>
  <script src="../js/store.js?v=20261031demoPerm"></script>
  <script src="../js/shell.js?v=20261031permNav"></script>
  <script src="../js/pager.js?v=20261027pager"></script>
  <script src="../js/project-union.js"></script>
  <script src="../js/novice-guide.js?v=20261031tour7"></script>
  <script src="../js/novice-tour-kit.js?v=20261031doneFix"></script>
  <script src="../js/novice-tours.js?v=20261031doneFix"></script>
  <script>
    FZShell.boot({ active: "projects" });
    var MARK = { chigua: "瓜", video: "视", short_drama: "剧" };
    var list = document.getElementById("project-list");
    var pagerBox = document.getElementById("project-pager");
    var page = 1;
    var pageSize = FZPager.DEFAULT;

    function factRow(label, value, valueCls) {
      if (value == null || value === "") return "";
      return (
        '<div class="proj-fact"><span class="proj-fact-k">' +
        label +
        '</span><span class="proj-fact-v' +
        (valueCls ? " " + valueCls : "") +
        '">' +
        value +
        "</span></div>"
      );
    }

    function cardHtml(p) {
      FZProjectUnion.normalizeProject(p);
      var st = FZStore.projectStatusLabel(p);
      var type = p.siteType || "chigua";
      var typeLabel = FZProjectUnion.siteTypeLabel(type);
      var channelOn = !!p.contentActivated;
      var toEdit = !!p.autoToEdit;
      var autoPush = !!p.autoPush;
      var chN = FZStore.projectChannels(p).length;
      var appId = (p.creds && p.creds.appId) || "";
      var coverW = p.coverWidth;
      var coverH = p.coverHeight;
      var noviceQ = "";
      try {
        var nq = new URLSearchParams(location.search).get("novice");
        if (nq) noviceQ = "&novice=" + encodeURIComponent(nq);
      } catch (err) {}
      var actions =
        '<a class="btn" href="./project-edit.html?id=' +
        encodeURIComponent(p.id) +
        noviceQ +
        '">项目详情</a>';
      if (p.status === "pending_activate") {
        actions +=
          '<a class="btn btn-primary" href="./project-connect.html?id=' +
          encodeURIComponent(p.id) +
          '">对接</a>';
      }
      var facts =
        factRow("内容通道", channelOn ? "已接通" : "待接通") +
        factRow("进编辑", toEdit ? "自动" : "人工") +
        factRow("推业务方", autoPush ? "自动" : "待确认");
      if (coverW && coverH) {
        facts += factRow("封面", coverW + " × " + coverH + " px");
      }
      if (p.userbotName) {
        facts += factRow("采集号", p.userbotName);
      } else {
        facts += factRow("采集号", "未关联", "is-muted");
      }
      facts += factRow("已绑频道", chN + " 个");
      if (appId) {
        facts += factRow("App ID", appId, "is-mono");
      }
      return (
        '<article class="proj-card">' +
        '<div class="proj-card-head">' +
        '<div class="proj-mark is-' +
        type +
        '" aria-hidden="true">' +
        (MARK[type] || "项") +
        "</div>" +
        '<div class="proj-card-head-main">' +
        '<h2 class="proj-title"><a href="./project-edit.html?id=' +
        encodeURIComponent(p.id) +
        noviceQ +
        '">' +
        p.name +
        "</a></h2>" +
        '<div class="proj-tags"><span class="proj-tag">' +
        typeLabel +
        "</span></div>" +
        "</div>" +
        '<div class="proj-status"><span class="tag ' +
        st.cls +
        '">' +
        st.text +
        "</span></div>" +
        "</div>" +
        '<div class="proj-facts">' +
        facts +
        "</div>" +
        '<div class="proj-actions">' +
        actions +
        "</div></article>"
      );
    }

    function paint() {
      var s = FZStore.read();
      var projects = FZStore.businessProjects
        ? FZStore.businessProjects(s)
        : (s.projects || []).filter(function (p) {
            return !p.isPublicPool;
          });
      if (!projects.length) {
        var canCreate =
          !FZStore.hasFeature || FZStore.hasFeature(s, "projects.list.create");
        list.innerHTML =
          '<div class="wb-empty-card wb-empty-card--lg">' +
          "<strong>创建你的第一个项目</strong>" +
          "<p>配齐基本信息与媒体配置后创建，再交给开发对接内容通道。接通后配置自动生效。</p>" +
          (canCreate
            ? '<a class="btn btn-primary" href="./project-setup.html?new=1">新建项目</a>'
            : '<p class="muted" style="margin:0">当前角色无新建权限，请联系主账号。</p>') +
          "</div>";
        pagerBox.innerHTML = "";
        return;
      }
      var slice = FZPager.slice(projects, page, pageSize);
      page = slice.page;
      pageSize = slice.pageSize;
      list.innerHTML = slice.items.map(cardHtml).join("");
      pagerBox.innerHTML = FZPager.html({
        total: slice.total,
        page: slice.page,
        pageSize: slice.pageSize
      });
    }

    FZPager.bind(pagerBox, {
      getState: function () {
        return { page: page, pageSize: pageSize };
      },
      setState: function (next) {
        if (next.page != null) page = next.page;
        if (next.pageSize != null) pageSize = next.pageSize;
      },
      onChange: paint
    });
    paint();
  </script>
</body>
</html>
