<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
  <title>每日数据</title>
<style>
  :root {
    --bg: #f3f5f8;
    --card: #fff;
    --ink: #1c2430;
    --muted: #5c6b7c;
    --line: #e7ecf2;
    --blue: #5b8ff9;
    --green: #5ad8a6;
    --slate: #5d7092;
    --gold: #f6bd16;
    --coral: #e8684a;
    --cyan: #6dc8ec;
    --purple: #9270ca;
    --soft: #f7f9fc;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: auto; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    font-size: 14px;
    line-height: 1.6;
  }
  .wrap { width: min(1180px, calc(100% - 32px)); margin: 0 auto; }
  header.top {
    background: #fff;
    border-bottom: 1px solid var(--line);
    padding: 28px 0 20px;
  }
  .kicker { color: var(--blue); font-size: 12px; letter-spacing: .12em; font-weight: 600; }
  h1 { margin: 6px 0 8px; font-size: 28px; line-height: 1.3; font-weight: 650; }
  .lead { margin: 0; color: var(--muted); max-width: 760px; }
  .rules { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .rule {
    background: var(--soft);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px 12px;
    color: #3d4c5f;
    font-size: 12px;
  }
  nav.bar {
    position: sticky;
    top: 0;
    z-index: 5;
    background: rgba(255,255,255,.96);
    border-bottom: 1px solid var(--line);
  }
  nav.bar .wrap { display: flex; gap: 6px; padding: 10px 0; overflow-x: auto; }
  nav.bar a {
    flex: 0 0 auto;
    text-decoration: none;
    color: #3d4c5f;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 13px;
  }
  nav.bar a:hover { border-color: var(--blue); color: var(--blue); }
  main { padding: 22px 0 64px; }
  section.mod { margin: 0 0 28px; scroll-margin-top: 62px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 20px;
    margin-top: 12px;
  }
  .mod-title { display: flex; gap: 12px; align-items: flex-start; }
  .num {
    width: 36px; height: 36px; border-radius: 10px;
    background: #eef4ff; color: #2f6fed;
    display: grid; place-items: center;
    font-weight: 700; flex: 0 0 auto;
  }
  h2 { margin: 0 0 6px; font-size: 20px; }
  .goal { margin: 0; color: #314056; }
  .chain {
    margin: 10px 0 0;
    padding: 8px 12px;
    background: var(--soft);
    border-radius: 8px;
    color: #314056;
  }
  .card-h { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin-bottom: 12px; }
  .card-h h3 { margin: 0; font-size: 15px; }
  .axis-note { color: var(--muted); font-size: 12px; margin: -4px 0 10px; }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; }
  button.chip {
    border: 1px solid var(--line);
    background: #fff;
    border-radius: 8px;
    padding: 4px 10px;
    font-size: 12px;
    color: #314056;
    cursor: pointer;
    font-family: inherit;
  }
  button.chip:hover { border-color: var(--blue); color: #2f6fed; }
  .split { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(260px, .8fr); gap: 18px; align-items: start; }
  .plot {
    background: #fbfcfe;
    border: 1px solid #eef2f6;
    border-radius: 12px;
    padding: 10px 10px 6px;
    min-height: 220px;
  }
  .defs { display: flex; flex-direction: column; gap: 12px; }
  .def { display: grid; grid-template-columns: 10px 1fr; gap: 8px; }
  .swatch { width: 10px; height: 10px; border-radius: 3px; margin-top: 6px; }
  .def strong { display: block; font-size: 13px; }
  .def p { margin: 2px 0; color: var(--muted); font-size: 12px; }
  .def .up { color: #0f766e; }
  .def .down { color: #be3b2f; }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 14px;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
  }
  th, td { padding: 7px 8px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th:first-child, td:first-child, th.left, td.left { text-align: left; }
  th { color: var(--muted); font-weight: 600; background: #fbfcfe; }
  tr.weekend td { background: #f8fafc; }
  tr.crash td { background: #fff6f4; }
  .table-wrap { overflow-x: auto; }
  .f-row { display: grid; grid-template-columns: 92px 1fr 72px; gap: 8px; align-items: center; margin: 7px 0; }
  .f-name { font-size: 12px; color: #314056; }
  .f-track { background: #eef2f6; border-radius: 6px; height: 16px; }
  .f-bar { height: 16px; border-radius: 6px; background: var(--blue); }
  .f-val { text-align: right; font-variant-numeric: tabular-nums; font-size: 12px; }
  .legend { display: flex; flex-wrap: wrap; gap: 10px; margin: 4px 2px 2px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
  .legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  .think { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .think article { background: var(--soft); border-radius: 10px; padding: 12px 14px; }
  .think h3 { margin: 0 0 6px; font-size: 14px; }
  .think ol { margin: 0; padding-left: 18px; color: #314056; }
  .think li { margin: 3px 0; }
  footer.note { color: var(--muted); font-size: 12px; padding: 8px 2px 0; }
  .mask {
    position: fixed; inset: 0; background: rgba(20, 32, 48, .45);
    display: grid; place-items: center; z-index: 20; padding: 20px;
  }
  .mask[hidden] { display: none; }
  .sheet {
    width: min(420px, 100%);
    background: #fff;
    border-radius: 14px;
    padding: 18px 18px 14px;
    border: 1px solid var(--line);
  }
  .sheet h3 { margin: 0 0 6px; font-size: 16px; }
  .sheet p.tip { margin: 0 0 12px; color: var(--muted); font-size: 12px; }
  .opt { padding: 8px 0; border-top: 1px solid var(--line); }
  .opt b { display: block; margin-bottom: 4px; }
  .opt span { display: block; color: var(--muted); font-size: 12px; margin: 4px 0; }
  .sheet button.close {
    margin-top: 12px; width: 100%;
    border: 0; background: #1c2430; color: #fff;
    border-radius: 8px; padding: 8px 12px;
    font-family: inherit; cursor: pointer;
  }
  @media (max-width: 860px) {
    .split, .think { grid-template-columns: 1fr; }
    h1 { font-size: 22px; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="kicker">示例产品 · 截至 2026-10-09</div>
    <h1>每日数据</h1>
    <p class="lead">从人从哪来，到还在不在、钱有没有留下，再到自己找、叫回来、消息有没有把人叫来。每一块先看要确认的事，再看用户走到哪一步。右边写这个数变高、变低时，业务上发生了什么。</p>
    <div class="rules">
      <span class="rule">和昨天比，也和上周同一天比</span>
      <span class="rule">看多天时，同一个人只算一次</span>
      <span class="rule">留存按新用户来的那天算，没到的日期先空着</span>
      <span class="rule">10 月 2 日有故障，当天的下跌先看这里</span>
    </div>
  </div>
</header>
<nav class="bar">
  <div class="wrap">
    <a href="#m1">1 人从哪来</a>
    <a href="#m2">2 有多少人</a>
    <a href="#m3">3 用得深不深</a>
    <a href="#m4">4 会不会再来</a>
    <a href="#m5">5 钱</a>
    <a href="#m6">6 还会不会付钱</a>
    <a href="#m7">7 是不是故障</a>
    <a href="#m8">8 搜索</a>
    <a href="#m9">9 召回</a>
    <a href="#m10">10 推送</a>
    <a href="#m11">有变化时先看哪里</a>
  </div>
</nav>
<main class="wrap" id="main"></main>
<div class="mask" id="mask" hidden>
  <div class="sheet" role="dialog" aria-modal="true">
    <h3 id="mask-title">查看条件</h3>
    <p class="tip">这张图可以按下面的条件分开看。</p>
    <div id="mask-body"></div>
    <button class="close" type="button" id="mask-close">关闭</button>
  </div>
</div>
<script>
const COLORS = { blue:"#5B8FF9", green:"#5AD8A6", slate:"#5D7092", gold:"#F6BD16", coral:"#E8684A", cyan:"#6DC8EC", purple:"#9270CA" };

function pad(n){ return String(n).padStart(2,"0"); }
function iso(dt){ return dt.getFullYear()+"-"+pad(dt.getMonth()+1)+"-"+pad(dt.getDate()); }
function md(dt){ return pad(dt.getMonth()+1)+"/"+pad(dt.getDate()); }
function addDays(dt, n){ const x = new Date(dt); x.setDate(x.getDate()+n); return x; }
function weekend(dt){ const w = dt.getDay(); return w===0 || w===6; }
function fmtNum(v){ return v==null ? "—" : Math.round(v).toLocaleString("zh-CN"); }
function fmtPct(v){ return v==null ? "—" : (v*100).toFixed(1)+"%"; }
function fmtMin(v){ return v==null ? "—" : v.toFixed(1); }
function fmtMoney(v){ return v==null ? "—" : "¥"+Math.round(v).toLocaleString("zh-CN"); }
function esc(s){ return String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

function buildRows(){
  const end = new Date(2026, 9, 9);
  const n = 45;
  const rows = [];
  for (let i = 0; i < n; i++){
    const dt = addDays(end, i-(n-1));
    const t = i/(n-1);
    const we = weekend(dt) ? 1 : 0;
    const crash = iso(dt)==="2026-10-02" ? 1 : 0;
    const wave = Math.sin(i*0.85)*0.025;
    const feed = 0.12 + t*0.30;
    const organic = 0.36 - t*0.08;
    const unknown = Math.max(0.03, 0.07 - t*0.03);
    const store = Math.max(0.2, 1 - feed - organic - unknown);
    const sumShare = store+organic+feed+unknown;
    const share = { store:store/sumShare, organic:organic/sumShare, feed:feed/sumShare, unknown:unknown/sumShare };
    const newcomers = Math.round((1900 + t*1100 + we*260 - crash*480) * (1+wave));
    const oldUsers = Math.round((12600 - t*1600 + we*520 - crash*900) * (1+wave*0.4));
    const dau = newcomers + oldUsers;
    const openFromInstall = 0.74 - crash*0.11 - feed*0.03;
    const installFromDownload = 0.78 - crash*0.04;
    const downloadFromClick = 0.44;
    const clickFromTouch = 0.085;
    const firstOpen = newcomers;
    const installs = firstOpen / openFromInstall;
    const downloads = installs / installFromDownload;
    const clicks = downloads / downloadFromClick;
    const touches = clicks / clickFromTouch;
    const feedUsers = Math.round(newcomers * share.feed);
    const spend = feedUsers * (6.8 + t*1.6);
    const sessions = 3.15 + t*0.15 + we*0.25 - crash*0.35 + Math.sin(i)*0.05;
    const onceShare = 0.31 + feed*0.12 + crash*0.06;
    const perSession = 6.4 - t*0.7 - crash*0.8;
    const perUserMin = sessions * perSession;
    const firstMin = 9.2 - feed*4 - crash*1.5;
    const firstReturn = 0.28 - feed*0.08 - crash*0.05;
    const payRate = 0.046 - feed*0.012 - crash*0.004;
    const payUsers = Math.round(dau * payRate);
    const arppu = 36 + (1-t)*6 - crash*2;
    const gross = payUsers * arppu;
    const refundRate = 0.035 + (t>0.72 ? 0.018 : 0) + crash*0.01;
    const refund = gross * refundRate;
    const revenue = gross - refund;
    const newRevenue = revenue * (0.28 + feed*0.35);
    const oldRevenue = revenue - newRevenue;
    const firstPayShare = 0.34 + feed*0.22;
    const clickBuy = Math.round(dau * (0.09 - crash*0.01));
    const orders = Math.round(clickBuy * 0.64);
    const paySuccessRate = 0.94 - crash*0.07;
    const payOkOrders = Math.round(orders * paySuccessRate);
    const expire = Math.round(160 + we*24 + Math.sin(i*0.5)*12);
    const renewRate = 0.46 - t*0.08 - crash*0.04;
    const renewed = Math.round(expire * renewRate);
    const lateRate = 0.07 + crash*0.03;
    const eligible = Math.round(2100 + we*80 - t*150);
    const repurchaseRate = 0.125 - t*0.02;
    const repurchaseUsers = Math.round(eligible * repurchaseRate);
    const repurchaseArpu = 22 + Math.sin(i*0.4)*2;
    const searchEnter = Math.round(dau * (0.16 + t*0.05 - crash*0.02));
    const searchSubmit = Math.round(searchEnter * (0.74 - crash*0.06));
    const noResult = 0.14 + t*0.07 + crash*0.02;
    const searchWithResult = Math.round(searchSubmit * (1 - noResult));
    const searchClick = 0.48 - t*0.06 - crash*0.04;
    const searchClicked = Math.round(searchWithResult * searchClick);
    const searchDone = 0.36 - t*0.05 - crash*0.05;
    const searchContinued = Math.round(searchClicked * searchDone);
    const searchTimes = Math.round(searchSubmit * (1.35 + t*0.25));
    const searchPerUser = searchTimes / dau;
    const pool30 = Math.round(dau / 0.21);
    const silent7 = Math.round(pool30 * (0.34 + t*0.05));
    const silent30 = Math.round(pool30 * (0.16 + t*0.03));
    const newSilent7 = Math.round(dau * (0.025 + t*0.008 + crash*0.01));
    const newSilent30 = Math.round(newSilent7 * 0.38);
    const back7 = 0.11 - t*0.02 - crash*0.015;
    const back30 = 0.05 - t*0.01 - crash*0.008;
    const returned7 = Math.round(silent7 * back7);
    const returned30 = Math.round(silent30 * back30);
    const backTwice = 0.41 - t*0.06 - crash*0.08;
    const backD7 = 0.24 - t*0.04 - crash*0.05;
    const sent = Math.round(oldUsers * 0.42 + newcomers * 0.15);
    const arriveRate = 0.86 - crash*0.14;
    const arrived = Math.round(sent * arriveRate);
    const pushClickRate = 0.075 - t*0.015 - crash*0.01;
    const pushClicks = Math.round(arrived * pushClickRate);
    const pushStay = 0.44 - t*0.08 - crash*0.06;
    const pushStayed = Math.round(pushClicks * pushStay);
    const pushFirst = Math.round(pushClicks * 0.62);
    const pushOff = Math.round(dau * (0.003 + t*0.0025));
    const pushReachUsers = Math.round(dau * (0.32 + t*0.04));
    const pushPerUser = arrived / Math.max(pushReachUsers, 1);
    const starts = Math.round(dau * (3.6 + we*0.2));
    const crashRate = 0.0035 + crash*0.021;
    const loadFail = 0.011 + crash*0.046;
    const slow = 0.055 + crash*0.04;
    const d1base = 0.45 - share.feed*0.20 - crash*0.07;
    rows.push({
      dt, date: iso(dt), label: md(dt), we: weekend(dt), crash: crash===1,
      newcomers, oldUsers, dau, share, feedUsers, spend,
      touches, clicks, downloads, installs, firstOpen, openFromInstall,
      installFromDownload, downloadFromClick, clickFromTouch,
      sessions, onceShare, perSession, perUserMin, firstMin, firstReturn,
      payUsers, payRate, arppu, revenue, newRevenue, oldRevenue, firstPayShare,
      refund, refundRate, clickBuy, orders, payOkOrders, paySuccessRate,
      expire, renewRate, renewed, lateRate, eligible, repurchaseRate, repurchaseUsers, repurchaseArpu,
      starts, crashRate, loadFail, slow, payFail: 1-paySuccessRate,
      d1: d1base, d3: d1base*0.74, d7: d1base*0.52, d15: d1base*0.34, d30: d1base*0.2,
      oldD1: 0.58 - t*0.04 - crash*0.06,
      payD7: 0.4 - t*0.05 - crash*0.04,
      newPay7: 0.072 - share.feed*0.03 - crash*0.008,
      searchEnter, searchSubmit, noResult, searchWithResult, searchClicked, searchClick, searchDone, searchContinued, searchPerUser,
      silent7, silent30, newSilent7, newSilent30, back7, back30, returned7, returned30, backTwice, backD7,
      sent, arriveRate, arrived, pushClickRate, pushClicks, pushStay, pushStayed, pushFirst, pushOff, pushPerUser
    });
  }
  const endTime = rows[rows.length-1].dt.getTime();
  const byTime = new Map(rows.map(r => [r.dt.getTime(), r]));
  rows.forEach(r => {
    const ok = days => addDays(r.dt, days).getTime() <= endTime;
    if (!ok(1)) r.d1 = null;
    if (!ok(3)) r.d3 = null;
    if (!ok(7)) r.d7 = null;
    if (!ok(15)) r.d15 = null;
    if (!ok(30)) r.d30 = null;
    if (!ok(1)) r.oldD1 = null;
    if (!ok(7)) r.payD7 = null;
    if (!ok(6)) r.newPay7 = null;
    if (!ok(7)) r.backD7 = null;
    const ahead = byTime.get(addDays(r.dt, 6).getTime());
    r.feedD7 = ok(7) ? (0.2 - r.share.feed*0.04) : null;
    r.storeD7 = ok(7) ? 0.33 : null;
    r.organicD7 = ok(7) ? 0.29 : null;
    r.unknownD7 = ok(7) ? 0.15 : null;
    r.feedPay7 = ok(6) ? 0.041 : null;
    r.storePay7 = ok(6) ? 0.086 : null;
    r.organicPay7 = ok(6) ? 0.07 : null;
    r.cac = r.feedUsers ? r.spend / r.feedUsers : null;
    r.active7 = Math.round(r.dau / (0.40 + (r.we?0.02:0)));
    r.active30 = Math.round(r.dau / 0.21);
    r.heavy7 = 0.22 - (r.share.feed*0.06);
    r.daysPerUser7 = 2.55 - r.share.feed*0.35;
    void ahead;
  });
  return rows;
}

const rows = buildRows();
const last = rows[rows.length-1];
const recent = rows.slice(-30);
const tableRows = rows.slice(-14);
const cohort = rows.find(r => r.date==="2026-09-18");

function lineChart(spec){
  const w = 680, h = 250;
  const pad = { l:46, r: spec.right ? 46 : 14, t:16, b:28 };
  const series = spec.series;
  const labels = spec.labels;
  const vals = series.flatMap(s => s.data.filter(v => v!=null && !Number.isNaN(v)));
  let min = 0;
  let max = Math.max(...vals, 1);
  if (spec.tight && vals.length){
    const lo = Math.min(...vals);
    const span = Math.max(max - lo, max * 0.02);
    min = Math.max(0, lo - span * 0.8);
    max = max + span * 0.35;
  } else {
    max = max * 1.12;
  }
  const innerW = w - pad.l - pad.r;
  const innerH = h - pad.t - pad.b;
  const x = i => pad.l + (labels.length<=1 ? innerW/2 : innerW * i/(labels.length-1));
  const y = v => pad.t + innerH * (1 - (v-min)/(max-min));
  let rightMin = 0, rightMax = 1, yR = () => 0;
  if (spec.right){
    const rv = spec.right.data.filter(v => v!=null);
    rightMax = Math.max(...rv, 0.01);
    if (spec.tight && rv.length){
      const lo = Math.min(...rv);
      const span = Math.max(rightMax - lo, rightMax * 0.02);
      rightMin = Math.max(0, lo - span * 0.8);
      rightMax = rightMax + span * 0.35;
    } else {
      rightMax = rightMax * 1.15;
    }
    yR = v => pad.t + innerH * (1 - (v-rightMin)/(rightMax-rightMin));
  }
  const grid = [0,1,2,3].map(i => {
    const v = min + (max-min)*i/3;
    const yy = y(v);
    return `<line x1="${pad.l}" y1="${yy}" x2="${w-pad.r}" y2="${yy}" stroke="#e7ecf2"/>
      <text x="${pad.l-6}" y="${yy+3}" text-anchor="end" font-size="10" fill="#8b98a8">${esc(spec.format(v))}</text>`;
  }).join("");
  let rightLabels = "";
  if (spec.right){
    rightLabels = [0,1,2,3].map(i => {
      const v = rightMin + (rightMax-rightMin)*i/3;
      const yy = yR(v);
      return `<text x="${w-pad.r+6}" y="${yy+3}" font-size="10" fill="${spec.right.color}">${esc(spec.right.format(v))}</text>`;
    }).join("");
  }
  function path(data, mapY){
    let d = "", pen = false;
    data.forEach((v,i) => {
      if (v==null){ pen = false; return; }
      d += (pen ? "L" : "M") + x(i) + " " + mapY(v) + " ";
      pen = true;
    });
    return d;
  }
  const lines = series.map(s => `<path d="${path(s.data, y)}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`).join("");
  const rightLine = spec.right ? `<path d="${path(spec.right.data, yR)}" fill="none" stroke="${spec.right.color}" stroke-width="2" stroke-dasharray="4 3"/>` : "";
  const marks = (spec.marks||[]).map(m => {
    const i = labels.indexOf(m);
    if (i<0) return "";
    return `<line x1="${x(i)}" y1="${pad.t}" x2="${x(i)}" y2="${h-pad.b}" stroke="#E8684A" stroke-dasharray="3 3" opacity="0.7"/>
      <text x="${x(i)+4}" y="${pad.t+12}" font-size="10" fill="#E8684A">故障</text>`;
  }).join("");
  const step = Math.max(1, Math.ceil(labels.length/6));
  const xlab = labels.map((lb,i) => i%step===0 ? `<text x="${x(i)}" y="${h-8}" text-anchor="middle" font-size="10" fill="#8b98a8">${esc(lb)}</text>` : "").join("");
  const legendItems = series.map(s => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join("");
  const rightLeg = spec.right ? `<span><i style="background:${spec.right.color}"></i>${esc(spec.right.name)}</span>` : "";
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="250" role="img">${grid}${marks}${lines}${rightLine}${rightLabels}${xlab}</svg>
    <div class="legend">${legendItems}${rightLeg}</div>`;
}

function bars(items){
  const max = Math.max(...items.map(d => d.value), 1);
  return items.map(d => {
    const w = Math.max(4, d.value/max*100);
    return `<div class="f-row"><div class="f-name">${esc(d.name)}</div><div class="f-track"><div class="f-bar" style="width:${w}%;background:${d.color}"></div></div><div class="f-val">${esc(d.text)}</div></div>`;
  }).join("");
}

function donut(parts){
  const total = parts.reduce((s,p)=>s+p.value,0) || 1;
  const r = 42, c = 2*Math.PI*r;
  let offset = 0;
  const segs = parts.map(p => {
    const len = c * p.value/total;
    const el = `<circle cx="60" cy="60" r="${r}" fill="none" stroke="${p.color}" stroke-width="16" stroke-dasharray="${len} ${c-len}" stroke-dashoffset="${-offset}" transform="rotate(-90 60 60)"/>`;
    offset += len;
    return el;
  }).join("");
  const legend = parts.map(p => `<span><i style="background:${p.color}"></i>${esc(p.name)} ${fmtPct(p.value/total)}</span>`).join("");
  return `<div style="display:flex;gap:12px;align-items:center"><svg width="120" height="120" viewBox="0 0 120 120">${segs}</svg><div class="legend" style="flex-direction:column;align-items:flex-start">${legend}</div></div>`;
}

function defsHtml(list){
  return `<div class="defs">${list.map(d => `<div class="def"><i class="swatch" style="background:${d.color||"#5D7092"}"></i><div><strong>${esc(d.name)}</strong><p>${esc(d.how)}</p><p class="up">涨：${esc(d.up)}</p><p class="down">跌：${esc(d.down)}</p></div></div>`).join("")}</div>`;
}

function chip(id){ return `<button class="chip" type="button" data-filter="${id}">筛选</button>`; }

function table(columns, data){
  const head = `<tr>${columns.map((c,i)=>`<th class="${i===0?"left":""}">${esc(c.name)}</th>`).join("")}</tr>`;
  const body = data.map(r => {
    const cls = r.crash ? "crash" : (r.we ? "weekend" : "");
    const tds = columns.map((c,i) => `<td class="${i===0?"left":""}">${c.cell(r)}</td>`).join("");
    return `<tr class="${cls}">${tds}</tr>`;
  }).join("");
  return `<div class="table-wrap"><table><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
}

function card(title, axis, filterId, plot, defs, extra){
  return `<div class="card"><div class="card-h"><h3>${esc(title)}</h3><div class="filters">${chip(filterId)}</div></div>
    <p class="axis-note">${esc(axis)}</p>
    <div class="split"><div class="plot">${plot}</div>${defsHtml(defs)}</div>${extra||""}</div>`;
}
